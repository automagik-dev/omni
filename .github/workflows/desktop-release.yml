name: Desktop Release

# Builds the Omni desktop app (apps/omni-desktop) for one Omni version and publishes it as
# the GitHub release `omni-desktop-v<version>`, where `omni desktop` (packages/cli
# src/commands/desktop.ts) finds it: the Linux AppImage and deb, the macOS arm64 dmg, and
# SHA256SUMS, which the CLI checks every download against. Installed apps update from the
# same release (apps/omni-desktop/src/update.js): latest-linux.yml for the AppImage, and
# latest-mac.yml with the zip for macOS.
#
# version.yml calls this after each dev cut (a prerelease, like the npm `next` tag), at the
# bump commit, so the app and the plugins in it carry that exact version. Dispatch it by
# hand to rebuild a version.
#
# macOS signing and notarization are optional: with the MAC_CSC_LINK and
# MAC_CSC_KEY_PASSWORD secrets (the Developer ID Application certificate as a base64 .p12)
# the app is signed, and with APPLE_API_KEY (the App Store Connect .p8 contents),
# APPLE_API_KEY_ID and APPLE_API_ISSUER it is notarized. Without them the dmg is unsigned,
# and the release carries no macOS update: a signed app accepts only an update signed
# like itself, and an unsigned one cannot update.

on:
  workflow_call:
    inputs:
      version:
        description: 'Omni version to build (no v prefix)'
        required: true
        type: string
      ref:
        description: 'Exact commit to build (the version bump commit)'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        required: false
        type: boolean
        default: true
    secrets:
      MAC_CSC_LINK:
        required: false
      MAC_CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Omni version to build (no v prefix)'
        required: true
        type: string
      ref:
        description: 'Exact commit to build (default: the v<version> tag)'
        required: false
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        required: false
        type: boolean
        default: true

concurrency:
  group: desktop-release-${{ inputs.version }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-24.04
          - target: mac
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DO_NOT_TRACK: '1'
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || format('refs/tags/v{0}', inputs.version) }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: The app carries the version it is built as
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          actual=$(node -p "require('./apps/omni-desktop/package.json').version")
          [[ "${actual}" == "${VERSION}" ]] || { echo "::error ::apps/omni-desktop is ${actual}, not ${VERSION}"; exit 1; }

      - name: Install build tools
        working-directory: apps/omni-desktop
        run: npm ci --no-audit --no-fund

      - name: Prepare the runtime and the plugins
        working-directory: apps/omni-desktop
        run: node scripts/prepare-runtime.mjs

      - name: Build Linux AppImage and deb
        if: matrix.target == 'linux'
        working-directory: apps/omni-desktop
        run: npx --no-install electron-builder --linux AppImage deb --publish never

      - name: Build macOS dmg
        if: matrix.target == 'mac'
        working-directory: apps/omni-desktop
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [[ -n "${MAC_CSC_LINK}" ]]; then
            export CSC_LINK="${MAC_CSC_LINK}" CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD}"
            if [[ -n "${APPLE_API_KEY_CONTENT}" && -n "${APPLE_API_KEY_ID}" && -n "${APPLE_API_ISSUER}" ]]; then
              key="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
              trap 'rm -f "${key}"' EXIT
              (umask 077 && printf '%s' "${APPLE_API_KEY_CONTENT}" > "${key}")
              export APPLE_API_KEY="${key}"
            else
              echo "::warning ::No App Store Connect API key: the dmg is signed but not notarized"
              unset APPLE_API_KEY_ID APPLE_API_ISSUER
            fi
          else
            echo "::warning ::No signing certificate: the dmg is unsigned"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          npx --no-install electron-builder --mac dmg zip --arm64 --publish never
          if [[ -z "${MAC_CSC_LINK}" ]]; then
            echo "::warning ::Unsigned: no macOS update feed in this release"
            rm -f dist/latest-mac.yml dist/*.zip dist/*.zip.blockmap
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/omni-desktop/dist/*.AppImage
            apps/omni-desktop/dist/*.deb
            apps/omni-desktop/dist/*.dmg
            apps/omni-desktop/dist/*.zip
            apps/omni-desktop/dist/*.blockmap
            apps/omni-desktop/dist/latest-*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish omni-desktop-v${{ inputs.version }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      REF: ${{ inputs.ref || format('refs/tags/v{0}', inputs.version) }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || format('refs/tags/v{0}', inputs.version) }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        run: |
          set -euo pipefail
          TAG="omni-desktop-v${VERSION}"
          SHA=$(git rev-parse "HEAD^{commit}")
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" assets/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            flags=()
            [[ "${PRERELEASE}" == "true" ]] && flags+=(--prerelease)
            gh release create "${TAG}" assets/* "${flags[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${SHA}" \
              --title "Omni desktop ${VERSION}" \
              --notes "The Omni desktop app for Omni ${VERSION}: run \`npx @automagik/omni desktop\` (macOS arm64, Linux x64, WSL), or download a build below. SHA256SUMS lists every file."
          fi
