name: SDK Publish

# Manually-dispatched publish of the client SDK (packages/sdk) to public npm
# under Apache-2.0. The SDK is generated from the OpenAPI spec and consumed by
# the CLI in-repo via the workspace; this workflow lets the enterprise pack and
# third parties depend on a versioned, published package instead of a
# `file:../../../packages/sdk` reference.
#
# Trigger contract — operator-invoked workflow_dispatch ONLY. There is no
# push/tag trigger: the CLI's own npm publish (version.yml, @automagik/omni via
# OIDC) is a separate, unrelated pipeline. Keeping the SDK publish manual avoids
# racing version.yml and lets the operator gate the very first publish behind a
# dry-run.
#
# Channel contract — the npm dist-tag is derived from the selected ref and is
# never operator-controlled: dev -> next, homolog -> homolog, main -> latest.
# Other refs fail before the package or token can be used.
#
# Auth — NODE_AUTH_TOKEN is sourced from the NPM_TOKEN repo secret only in the
# real-publish step. Dry runs receive no credential. The CLI publishes via npm
# OIDC Trusted Publishing; the SDK cannot reuse that path until a trusted
# publisher entry exists for the final SDK package name.
#
# SCOPE NOTE: the package name is @omni/sdk (from packages/sdk/package.json).
# A non-dry-run is fail-closed until the repository variable SDK_NPM_PACKAGE is
# configured to exactly match that package name. This binds human scope-ownership
# confirmation to the reviewed package metadata; renames fail until the variable
# is deliberately updated.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (npm publish --dry-run — no upload). Leave ON for the first invocation to verify the tarball.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sdk-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish @omni/sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.14

      - name: Setup Node (npm registry auth)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK
        run: bunx turbo run build --filter=@omni/sdk

      - name: Resolve and validate publish target
        id: target
        env:
          APPROVED_PACKAGE: ${{ vars.SDK_NPM_PACKAGE }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./packages/sdk/package.json').name")"
          case "${GITHUB_REF_NAME}" in
            dev) DIST_TAG="next" ;;
            homolog) DIST_TAG="homolog" ;;
            main) DIST_TAG="latest" ;;
            *)
              echo "::error::SDK publishing is restricted to dev, homolog, or main (got ${GITHUB_REF_NAME})"
              exit 1
              ;;
          esac

          if [[ "${DRY_RUN}" != "true" ]]; then
            if [[ -z "${APPROVED_PACKAGE}" ]]; then
              echo "::error::SDK_NPM_PACKAGE is unset; confirm npm namespace ownership before enabling a real publish"
              exit 1
            fi
            if [[ "${APPROVED_PACKAGE}" != "${PACKAGE_NAME}" ]]; then
              echo "::error::SDK_NPM_PACKAGE (${APPROVED_PACKAGE}) does not match package.json (${PACKAGE_NAME})"
              exit 1
            fi
          fi

          echo "package_name=${PACKAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "dist_tag=${DIST_TAG}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${PACKAGE_NAME} from ${GITHUB_REF_NAME} to npm tag ${DIST_TAG} (dry_run=${DRY_RUN})"

      - name: Inspect npm package (dry run; no credential)
        if: ${{ inputs.dry_run == true }}
        env:
          NODE_AUTH_TOKEN: unused-dry-run
          HUSKY: "0"
          DIST_TAG: ${{ steps.target.outputs.dist_tag }}
        run: |
          cd packages/sdk
          echo "DRY RUN — inspecting tarball, no upload"
          npm publish --access public --tag "${DIST_TAG}" --dry-run

      - name: Publish to npm
        if: ${{ inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
          HUSKY: "0"
          DIST_TAG: ${{ steps.target.outputs.dist_tag }}
        run: |
          cd packages/sdk
          npm publish --access public --tag "${DIST_TAG}"
