# =============================================================================
# Publish the omni-api, autopg, and omni-admin-ui container images to GHCR.
# =============================================================================
# build-push         → deploy/Dockerfile          → ghcr.io/<owner>/omni-api
# build-push-autopg  → deploy/autopg.Dockerfile    → ghcr.io/<owner>/autopg
# build-push-ui      → deploy/Dockerfile.admin-ui  → ghcr.io/<owner>/omni-admin-ui
#
# These are the k8s images referenced by the Helm chart (deploy/helm/omni)
# for non-dev (registry) deploys; the OrbStack dev overlay keeps building
# locally and never pulls.
#
# build-push-ui bundles PRIVATE @khal-os/* packages, so it needs the
# KHAL_NPM_TOKEN repo secret (git.namastex.io registry). It is GATED on that
# secret's presence (check-ui-secret job): SKIPPED — not failed — until the
# secret is configured, so a promotion stays green; it self-activates once the
# token lands. The other two images have no private deps and always build.
#
# Triggers:
#   - push to main / homolog  → build + publish (the promotion targets)
#   - workflow_dispatch        → manual rebuild
# PRs do NOT publish (build is validated by the normal CI type/lint/test gate);
# publishing is reserved for the protected branches.
#
# RELEASE NOTE (LOW-18): merges to `main` must NOT carry `[skip ci]` in the
# merge commit message — GitHub then skips ALL workflows for that push,
# including this publish, and the promoted version never gets an image.
# Integration-branch tip commits often carry `[skip ci]` from the version-bump
# bot, so prefer "Create a merge commit" or "Squash and merge" (with a clean
# message) over "Rebase and merge", and check the final message before merging
# a promotion PR.
#
# Actions are pinned to full commit SHAs (supply-chain hardening: this
# workflow holds `packages: write`). Bump the SHA and the trailing version
# comment together.
# =============================================================================
name: Publish Image

on:
  push:
    branches: [main, homolog]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'deploy/Dockerfile'
      - 'deploy/autopg.Dockerfile'
      - 'deploy/Dockerfile.admin-ui'
      # Chart/values-only promotions still advance appVersion (version.yml
      # stamps deploy/helm/omni/Chart.yaml); without this filter the stamped
      # tag would never get an image built (stranded-tag case).
      - 'deploy/helm/**'
      - 'bun.lock'
      - '.github/workflows/image-publish.yml'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms (comma-separated)'
        default: 'linux/amd64,linux/arm64'

concurrency:
  group: image-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # GitHub-native build provenance for the published images — this is what
  # makes the documented `gh attestation verify oci://…` command
  # (deploy/README.md) actually pass. `id-token` signs via OIDC/Sigstore;
  # `attestations` stores the provenance in the repo's Attestations API.
  id-token: write
  attestations: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/omni-api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve image version
        id: meta
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version" 2>/dev/null || echo 0.0.0)"
          {
            echo "version=${VERSION}"
            echo "sha_short=${GITHUB_SHA::12}"
            echo "ref_name=${GITHUB_REF_NAME}"
          } >> "$GITHUB_OUTPUT"

      # LOW-23: arm64 is built under QEMU emulation (slow for the Bun
      # install/build stages). The repo is public, so native
      # `ubuntu-24.04-arm` runners are free; the upgrade path is a
      # per-platform matrix (push-by-digest) + `buildx imagetools create`
      # manifest merge. Deliberately not done here: the QEMU path is proven
      # on main and a split cannot be validated before a main promotion.
      # Revisit if arm64 builds start timing out or OOMing.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.ref_name }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.ref_name }}-${{ steps.meta.outputs.sha_short }}
            ${{ env.IMAGE }}:v${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=omni-api
          cache-to: type=gha,mode=max,scope=omni-api
          provenance: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      # GitHub-native provenance (Attestations API + registry referrer), so
      # `gh attestation verify oci://…` works as deploy/README.md documents.
      # BuildKit's inline `provenance: true` above is NOT visible to `gh`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Packages the automagik-dev/autopg release tarball as a container image
  # (that repo publishes no image of its own). The Helm chart's prod overlay
  # pins ghcr.io/<owner>/autopg:v<AUTOPG_VERSION>; the v<cli-version> /
  # <branch> / <branch>-<sha> tags ride along so every omni promotion has a
  # matching autopg tag (contract C1').
  build-push-autopg:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/autopg
      # autopg release baked into deploy/autopg.Dockerfile. Bump together
      # with that file's AUTOPG_VERSION/PG_RUNTIME_VERSION defaults.
      AUTOPG_VERSION: 3.0.7
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve image version
        id: meta
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version" 2>/dev/null || echo 0.0.0)"
          {
            echo "version=${VERSION}"
            echo "sha_short=${GITHUB_SHA::12}"
            echo "ref_name=${GITHUB_REF_NAME}"
          } >> "$GITHUB_OUTPUT"

      # QEMU is fine here: the Dockerfile is download-only (the fetch stage
      # runs on the build platform; only apt-get runs emulated).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: deploy
          file: deploy/autopg.Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          build-args: |
            AUTOPG_VERSION=${{ env.AUTOPG_VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.ref_name }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.ref_name }}-${{ steps.meta.outputs.sha_short }}
            ${{ env.IMAGE }}:v${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:v${{ env.AUTOPG_VERSION }}
          cache-from: type=gha,scope=autopg
          cache-to: type=gha,mode=max,scope=autopg
          provenance: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.AUTOPG_VERSION }}

      # Same GitHub-native provenance as omni-api above (see that comment).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Gate: secrets cannot be referenced in a job-level `if`, so surface the
  # KHAL_NPM_TOKEN presence as an output. build-push-ui skips cleanly (keeping
  # the promotion green) until the token is configured, then self-activates.
  check-ui-secret:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.probe.outputs.has_token }}
    steps:
      - id: probe
        env:
          KHAL_NPM_TOKEN: ${{ secrets.KHAL_NPM_TOKEN }}
        run: echo "has_token=${KHAL_NPM_TOKEN:+true}" >> "$GITHUB_OUTPUT"

  # Publishes the Omni Admin UI (apps/khal-ui) single-container image: one Bun
  # process serves the built SPA AND proxies /omni/* to omni-api, injecting the
  # omni_sk_ key server-side. Tags ride every omni promotion (v<cli-version> /
  # <branch> / <branch>-<sha>) like autopg, so the chart's
  # adminUi.image.tag "" → v<appVersion> always resolves.
  build-push-ui:
    runs-on: ubuntu-latest
    needs: check-ui-secret
    if: needs.check-ui-secret.outputs.has_token == 'true'
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/omni-admin-ui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve image version
        id: meta
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version" 2>/dev/null || echo 0.0.0)"
          {
            echo "version=${VERSION}"
            echo "sha_short=${GITHUB_SHA::12}"
            echo "ref_name=${GITHUB_REF_NAME}"
          } >> "$GITHUB_OUTPUT"

      # Assemble the @khal-os registry auth into an .npmrc mounted as a BuildKit
      # secret (never baked into a layer). Registry mapping matches
      # apps/khal-ui/.npmrc; the token is the KHAL_NPM_TOKEN repo secret.
      - name: Write @khal-os npmrc
        env:
          KHAL_NPM_TOKEN: ${{ secrets.KHAL_NPM_TOKEN }}
        run: |
          {
            echo "@khal-os:registry=https://git.namastex.io/api/packages/khal/npm/"
            echo "//git.namastex.io/api/packages/khal/npm/:_authToken=${KHAL_NPM_TOKEN}"
          } > "${RUNNER_TEMP}/khal.npmrc"

      # Pack-contract gate. The main ci.yml `bun test` deliberately EXCLUDES
      # apps/khal-ui (its @khal-os/* deps are private, so a token-less CI run
      # cannot install them). This is the only job holding the token, so the
      # khal-app.json contract (permissions / scopes, checked with
      # @khal-os/types validateManifest) is enforced here — and it is blocking:
      # a bad manifest fails the job before any image is built or pushed.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install khal-ui deps (@khal-os registry)
        working-directory: apps/khal-ui
        run: |
          cat "${RUNNER_TEMP}/khal.npmrc" >> "${HOME}/.npmrc"
          bun install --frozen-lockfile

      - name: Validate pack manifest contract
        working-directory: apps/khal-ui
        run: bun test package/src/__tests__/manifest.test.ts

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile.admin-ui
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          secret-files: |
            npmrc=${{ runner.temp }}/khal.npmrc
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.ref_name }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.ref_name }}-${{ steps.meta.outputs.sha_short }}
            ${{ env.IMAGE }}:v${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=omni-admin-ui
          cache-to: type=gha,mode=max,scope=omni-admin-ui
          provenance: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      # Same GitHub-native provenance as omni-api above (see that comment).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
