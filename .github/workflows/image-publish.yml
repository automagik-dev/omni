# Verify the already-published public-launch candidate without mutating Git,
# GHCR, npm, GitHub Releases, aliases, or deployment state. Production
# deployment authority lives outside this public repository; this workflow
# emits only a verification receipt for the protected dev-to-main promotion.
name: Verify Production Promotion

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-promotion-read-only
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  attestations: read

jobs:
  verify-promotion:
    name: Verify immutable v2.260830.2 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/omni-api
      CANDIDATE_VERSION: 2.260830.2
      CANDIDATE_SHA: b8c1bf20cd42b1e30974fc8d67f2b7d0fb620031
      CANDIDATE_DIGEST: sha256:dba9b81cead5efacf9303ab75487a762fa100992dc2bb52741524a7a036b2da8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Checkout immutable candidate source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: release-candidate
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Bind final main tree to the immutable candidate
        env:
          FINAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "::error::production promotion verification is restricted to main"
            exit 1
          }
          [[ "$(git rev-parse 'HEAD^{commit}')" == "${FINAL_SHA}" ]]
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse 'origin/main^{commit}')" == "${FINAL_SHA}" ]] || {
            echo "::error::checked-out final SHA is not the authoritative main tip"
            exit 1
          }
          scripts/release/verify-promotion-candidate.sh \
            --candidate-sha "${CANDIDATE_SHA}" \
            --final-sha "${FINAL_SHA}" \
            --version "${CANDIDATE_VERSION}" \
            --digest "${CANDIDATE_DIGEST}"

      - name: Set up Buildx for read-only OCI inspection
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Verify exact OCI alias, index, and GitHub provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          preflight="${RUNNER_TEMP}/release-preflight.out"
          GITHUB_OUTPUT="${preflight}" scripts/release/verify-oci-release.sh \
            --source-dir "${GITHUB_WORKSPACE}/release-candidate" \
            --ref "refs/tags/v${CANDIDATE_VERSION}" \
            --expected-version "${CANDIDATE_VERSION}" \
            --expected-sha "${CANDIDATE_SHA}" \
            --image "${IMAGE}" \
            --expected-existing-digest "${CANDIDATE_DIGEST}"
          grep -qx 'publish_required=false' "${preflight}"
          grep -qx "existing_digest=${CANDIDATE_DIGEST}" "${preflight}"

          docker buildx imagetools inspect "${IMAGE}@${CANDIDATE_DIGEST}" \
            > "${RUNNER_TEMP}/image-index.txt"
          python3 - "${RUNNER_TEMP}/image-index.txt" <<'PY'
          import sys

          text = open(sys.argv[1], encoding="utf-8").read()
          required = (
              "MediaType: application/vnd.oci.image.index.v1+json",
              "Platform:    linux/amd64",
              "Platform:    linux/arm64",
          )
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f"verified OCI index is missing: {missing}")
          PY
          gh attestation verify "oci://${IMAGE}@${CANDIDATE_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --source-digest "${CANDIDATE_SHA}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/image-build.yml"

      - name: Install cosign for read-only release verification
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Verify existing public release without republishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/release/verify-remote-tag.sh \
            --remote origin \
            --version "${CANDIDATE_VERSION}" \
            --mode exact \
            --expected-sha "${CANDIDATE_SHA}"

          tag="v${CANDIDATE_VERSION}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            > "${RUNNER_TEMP}/release.json"
          python3 - "${RUNNER_TEMP}/release.json" "${tag}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              release = json.load(handle)
          if release.get("tag_name") != sys.argv[2]:
              raise SystemExit("public release tag does not match the candidate")
          if release.get("draft") is not False or release.get("prerelease") is not False:
              raise SystemExit("candidate release is not public stable")
          PY

          release_dir="${RUNNER_TEMP}/existing-release"
          mkdir -p "${release_dir}"
          gh release download "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${release_dir}"
          scripts/release/verify-release-assets.py \
            --version "${CANDIDATE_VERSION}" \
            --release-json "${RUNNER_TEMP}/release.json" \
            --dist "${release_dir}"
          for tarball in "${release_dir}"/*.tar.gz; do
            cosign verify-blob \
              --bundle "${tarball}.bundle" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sign-attest.yml@refs/tags/v${CANDIDATE_VERSION}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${tarball}"
            # Offline: the shipped Sigstore bundle must bind this tarball's
            # digest to the candidate source and the signing workflow.
            gh attestation verify "${tarball}" \
              --bundle "${tarball}.provenance.json" \
              --repo "${GITHUB_REPOSITORY}" \
              --source-digest "${CANDIDATE_SHA}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/sign-attest.yml"
            # Online: the same attestation must be registered in the
            # GitHub Attestations API under the candidate identity.
            gh attestation verify "${tarball}" \
              --repo "${GITHUB_REPOSITORY}" \
              --source-digest "${CANDIDATE_SHA}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/sign-attest.yml"
          done

      - name: Verify stable npm state without publishing or moving latest
        run: |
          set -euo pipefail
          published="$(npm view "@automagik/omni@${CANDIDATE_VERSION}" version)"
          latest="$(npm view @automagik/omni dist-tags --json | jq -r '.latest // empty')"
          state="$(scripts/release/verify-npm-stable-state.sh \
            --expected "${CANDIDATE_VERSION}" \
            --published "${published}" \
            --latest "${latest}")"
          [[ "${state}" == "npm_action=none" ]] || {
            echo "::error::stable npm state is not already exact; read-only promotion refuses repair"
            exit 1
          }

      - name: Write read-only promotion receipt
        run: |
          {
            echo "### Verified Omni public-launch candidate"
            echo "- source: \`${CANDIDATE_SHA}\`"
            echo "- version: \`${CANDIDATE_VERSION}\`"
            echo "- OCI digest: \`${CANDIDATE_DIGEST}\`"
            echo "- final main tree: \`${GITHUB_SHA}\`"
            echo "- result: immutable artifacts and final image build inputs verified"
            echo "- mutation boundary: no build, tag, release, alias, repository, or cluster write"
          } >> "${GITHUB_STEP_SUMMARY}"
