name: Release

# v3-prerelease-trust-loop G2 — orchestrator that chains the signed-tarball
# pipeline (build → sign-attest → publish) AND preserves the legacy npm OIDC
# Trusted Publishing path. Single workflow run, sequenced jobs via
# workflow_call. No workflow_run chaining (anti-recursion guard).
#
# Trigger contract — refs/tags/v* push (or operator-invoked workflow_dispatch).
#
# The cosign keyless OIDC SAN URI binds to .github/workflows/sign-attest.yml@<ref>
# because the cosign step physically lives inside sign-attest.yml. pgserve's
# trust-list (src/cosign/trust-list.js) anchors `pgserve verify --slug omni`
# on this filename literally — renaming or relocating sign-attest.yml breaks
# the consumer trust loop.
#
# Job topology:
#   1. build           — workflow_call into build-tarballs.yml (matrix × 4 platforms)
#   2. sign-attest     — workflow_call into sign-attest.yml (cosign keyless + SLSA L3)
#   3. publish         — workflow_call into release-publish.yml (GH release + assets)
#   4. release-notes   — git-cliff changelog appended to the GH release body.
#
# npm publishing happens in version.yml inline for dev auto-versioning.
# Single source of truth — no duplicate publish step here. Codex P1 on PR #633 caught the gap when a previous
# revision of this file ran an unconditional `npm publish --tag latest`
# alongside version.yml's @next publish, promoting dev cuts to @latest.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2.260512.1 — no v prefix)'
        required: true
        type: string
      channel:
        description: 'Release channel — stable is authorized orchestration; dev is a prerelease'
        required: false
        type: choice
        default: stable
        # Omni has exactly two active branches/channels: dev and stable main.
        options:
          - stable
          - dev
      expected_sha:
        description: 'Stable only: exact verified release source SHA'
        required: false
        type: string
      expected_digest:
        description: 'Stable only: exact verified omni-api OCI digest'
        required: false
        type: string
      orchestrator_run_id:
        description: 'Stable only: exact in-progress image-publish workflow run'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize release channel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Reject unverified stable entry points
        env:
          CHANNEL: ${{ inputs.channel || 'stable' }}
          ACTOR: ${{ github.actor }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/omni-api
        run: |
          set -euo pipefail
          if [[ "${CHANNEL}" == "stable" ]]; then
            [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${ACTOR}" == "github-actions[bot]" ]]
            [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${EXPECTED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "${ORCHESTRATOR_RUN_ID}" =~ ^[0-9]+$ ]]
            [[ "${GITHUB_REF}" == "refs/tags/v${INPUT_VERSION}" ]]
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ORCHESTRATOR_RUN_ID}" > "${RUNNER_TEMP}/orchestrator.json"
            scripts/release/verify-orchestrator-run.py \
              --run-json "${RUNNER_TEMP}/orchestrator.json" \
              --repository "${GITHUB_REPOSITORY}" \
              --source-sha "${EXPECTED_SHA}"
            gh attestation verify "oci://${IMAGE}@${EXPECTED_DIGEST}" \
              --repo "${GITHUB_REPOSITORY}" \
              --source-digest "${EXPECTED_SHA}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/image-publish.yml"
          fi

  # ---------------------------------------------------------------------------
  # Signed-tarball pipeline (mirror of genie pattern)
  # ---------------------------------------------------------------------------
  build:
    needs: authorize
    uses: ./.github/workflows/build-tarballs.yml
    permissions:
      contents: read

  sign-attest:
    needs: build
    uses: ./.github/workflows/sign-attest.yml
    permissions:
      contents: write       # SLSA reusable nested upload-assets static check
      id-token: write       # cosign keyless + attest-build-provenance OIDC
      attestations: write   # GitHub Attestations API registration
      actions: read         # cross-run artifact metadata

  publish:
    needs: sign-attest
    uses: ./.github/workflows/release-publish.yml
    permissions:
      contents: write       # gh release create/upload + push latest.json
      actions: read
      packages: read
      attestations: read
    with:
      version: ${{ needs.sign-attest.outputs.version }}
      # workflow_dispatch supplies the channel. Stable publishing requires the
      # authorized workflow_dispatch path; bare tag pushes do not release.
      channel: ${{ inputs.channel || 'stable' }}
      draft: false
      expected_sha: ${{ inputs.expected_sha }}
      expected_digest: ${{ inputs.expected_digest }}
      orchestrator_run_id: ${{ inputs.orchestrator_run_id }}
      orchestrated: true

  # ---------------------------------------------------------------------------
  # Release notes (git-cliff) — runs after publish so the GH release exists.
  # Updates the release body with the generated changelog.
  #
  # NOTE: npm publish is NOT performed by this workflow. version.yml owns
  # `npm publish` for dev. A
  # duplicate publish step here would race
  # version.yml's inline path AND, before this drop, the missing channel
  # gate meant dev dispatches were attempting `npm publish --tag latest`
  # against a version version.yml had already pushed as @next — promoting
  # dev cuts to the @latest dist-tag. Codex P1 on PR #633 surfaced this;
  # the publish-npm job has been removed to keep a single source of truth.
  # ---------------------------------------------------------------------------
  release-notes:
    needs: [sign-attest, publish]
    name: Generate release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: pkg
        env:
          PUBLISHED_VERSION: ${{ needs.sign-attest.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          [[ "${PUBLISHED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::signed artifact version is not a numeric dotted version"
            exit 1
          }
          if [[ -n "${REQUESTED_VERSION}" ]]; then
            [[ "${REQUESTED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::requested version is not a numeric dotted version"
              exit 1
            }
            [[ "${REQUESTED_VERSION}" == "${PUBLISHED_VERSION}" ]] || {
              echo "::error::requested version does not match the signed and published artifact version"
              exit 1
            }
          elif [[ "${REF_TYPE}" == "tag" && "${REF_NAME}" == "v${PUBLISHED_VERSION}" ]]; then
            :
          else
            echo "::error::release source ref does not match the signed and published artifact version"
            exit 1
          fi
          TAG="v${PUBLISHED_VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Find previous release tag
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          RELEASE_TAGS=$(gh release list --limit 50 --json tagName -q '.[].tagName')
          PREV=""
          while IFS= read -r candidate; do
            [[ "${candidate}" == "${TAG}" ]] && continue
            [[ "${candidate}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            PREV="${candidate}"
            break
          done <<< "${RELEASE_TAGS}"
          echo "tag=${PREV:-}" >> "$GITHUB_OUTPUT"
          echo "Previous release tag: ${PREV:-none}"

      - name: Generate changelog
        # git-cliff-action can fail after writing the requested file when the
        # generated multi-line changelog trips GitHub output delimiter parsing
        # ("Invalid value. Matching delimiter not found 'EOF'"). The release
        # artifact should not go red for that wrapper-output bug; the next step
        # uses /tmp/release-notes.md if it exists and otherwise leaves the
        # generated release body in place.
        continue-on-error: true
        uses: orhun/git-cliff-action@e16f179f0be49ecdfe63753837f20b9531642772 # v4.7.0
        with:
          config: cliff.toml
          args: >-
            ${{ steps.prev.outputs.tag && format('{0}..{1}', steps.prev.outputs.tag, steps.pkg.outputs.tag) || '' }}
            --output /tmp/release-notes.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Update release body with changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if [[ -s /tmp/release-notes.md ]]; then
            gh release edit "${TAG}" --notes-file /tmp/release-notes.md
            echo "Updated release body for ${TAG}"
          else
            echo "::warning::git-cliff produced empty notes; leaving auto-generated body in place"
          fi
