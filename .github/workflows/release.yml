name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: pkg
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version from package.json: ${VERSION}"

      - name: Check if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"

          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find previous release tag
        id: prev
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          PREV=$(gh release list --limit 50 --json tagName -q '.[].tagName' | grep -v "^${TAG}$" | head -1)
          echo "tag=${PREV:-}" >> "$GITHUB_OUTPUT"
          echo "Previous release tag: ${PREV:-none}"

      - name: Generate changelog
        uses: orhun/git-cliff-action@e16f179f0be49ecdfe63753837f20b9531642772 # v4.7.0
        if: steps.exists.outputs.skip != 'true'
        with:
          config: cliff.toml
          args: >-
            ${{ steps.prev.outputs.tag && format('{0}..HEAD', steps.prev.outputs.tag) || '' }}
            --output /tmp/release-notes.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Create release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          gh release create "${TAG}" \
            --target "${{ github.sha }}" \
            --title "${TAG}" \
            --notes-file /tmp/release-notes.md

      - name: Setup Bun
        if: steps.exists.outputs.skip != 'true'
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        if: steps.exists.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Build CLI
        if: steps.exists.outputs.skip != 'true'
        run: bunx turbo run build --filter=@automagik/omni

      - name: Publish to npm
        if: steps.exists.outputs.skip != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "ERROR: NPM_TOKEN secret is not set. Cannot publish to npm." >&2
            exit 1
          fi
          cd packages/cli && bun publish --access public

      # Note: CHANGELOG.md is intentionally not committed back to main.
      # main is a protected branch requiring PRs. The changelog is already
      # captured in the GitHub Release body above via git-cliff.
