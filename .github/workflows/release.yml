name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: pkg
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version from package.json: ${VERSION}"

      - name: Check if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"

          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find previous release tag
        id: prev
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          PREV=$(gh release list --limit 50 --json tagName -q '.[].tagName' | grep -v "^${TAG}$" | head -1)
          echo "tag=${PREV:-}" >> "$GITHUB_OUTPUT"
          echo "Previous release tag: ${PREV:-none}"

      - name: Generate changelog
        uses: orhun/git-cliff-action@e16f179f0be49ecdfe63753837f20b9531642772 # v4.7.0
        id: cliff
        if: steps.exists.outputs.skip != 'true'
        with:
          config: cliff.toml
          args: ${{ steps.prev.outputs.tag && format('{0}..v{1}', steps.prev.outputs.tag, steps.pkg.outputs.version) || '' }}
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Create release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_NOTES: ${{ steps.cliff.outputs.content }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          gh release create "${TAG}" \
            --target "${{ github.sha }}" \
            --title "${TAG}" \
            --notes "$RELEASE_NOTES"

      # Note: CHANGELOG.md is intentionally not committed back to main.
      # main is a protected branch requiring PRs. The changelog is already
      # captured in the GitHub Release body above via git-cliff.
