name: Release

on:
  workflow_run:
    workflows: ["Version"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    # Run when Version succeeded (automatic) or on manual dispatch
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: pkg
        run: |
          # Ensure all tags are fetched (actions/checkout may skip them)
          git fetch --tags --force

          # Latest v* tag — the one the Version workflow just created
          # Use creatordate sort (not version:refname) because the calver format
          # changed from v2.YYYYMMDD.N to v2.YYMMDD.N — old tags sort higher
          # numerically but are older chronologically.
          TAG=$(git tag --list 'v*' --sort=-creatordate | head -1)
          if [ -z "$TAG" ]; then
            echo "::error::No v* tags found — cannot release."
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG} (version: ${VERSION})"

      - name: Check if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"

          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        if: steps.exists.outputs.skip != 'true'
        run: git checkout "${{ steps.pkg.outputs.tag }}"

      - name: Find previous release tag
        id: prev
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          PREV=$(gh release list --limit 50 --json tagName -q '.[].tagName' | grep -v "^${TAG}$" | head -1)
          echo "tag=${PREV:-}" >> "$GITHUB_OUTPUT"
          echo "Previous release tag: ${PREV:-none}"

      - name: Generate changelog
        # git-cliff-action can fail after writing the requested file when the
        # generated multi-line changelog trips GitHub output delimiter parsing
        # ("Invalid value. Matching delimiter not found 'EOF'"). The release
        # artifact should not go red for that wrapper-output bug; use the file
        # when present and otherwise fall back to a small release note.
        continue-on-error: true
        uses: orhun/git-cliff-action@e16f179f0be49ecdfe63753837f20b9531642772 # v4.7.0
        if: steps.exists.outputs.skip != 'true'
        with:
          config: cliff.toml
          args: >-
            ${{ steps.prev.outputs.tag && format('{0}..{1}', steps.prev.outputs.tag, steps.pkg.outputs.tag) || '' }}
            --output /tmp/release-notes.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Ensure release notes file exists
        if: steps.exists.outputs.skip != 'true'
        run: |
          if [[ ! -s /tmp/release-notes.md ]]; then
            TAG="${{ steps.pkg.outputs.tag }}"
            printf 'Release %s\n' "${TAG}" > /tmp/release-notes.md
            echo "::warning::git-cliff produced no notes file; using fallback release body"
          fi

      - name: Create release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file /tmp/release-notes.md

      - name: Setup Bun
        if: steps.exists.outputs.skip != 'true'
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        if: steps.exists.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Build CLI
        if: steps.exists.outputs.skip != 'true'
        run: bunx turbo run build --filter=@automagik/omni

      - name: Publish to npm
        if: steps.exists.outputs.skip != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "ERROR: NPM_TOKEN secret is not set. Cannot publish to npm." >&2
            exit 1
          fi
          cd packages/cli && bun publish --access public

      # Note: CHANGELOG.md is intentionally not committed back to main.
      # main is a protected branch requiring PRs. The changelog is already
      # captured in the GitHub Release body above via git-cliff.
