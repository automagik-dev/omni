name: CI

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, dev, homolog]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets Scan (GitGuardian)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    # PRs are already covered by the GitGuardian GitHub App check. Keep this
    # action for push-time coverage only; running both on PRs can exhaust the
    # action API quota and produce false red CI despite the app passing.
    if: ${{ github.event_name == 'push' }}
    # NON-BLOCKING: a GitGuardian failure/cancellation (e.g. a missing/invalid
    # GITGUARDIAN_API_KEY or quota exhaustion) must NOT poison the overall CI
    # run conclusion. The `version.yml` auto-release gates on the main-push CI
    # run concluding `success`; before this guard, a cancelled secrets-scan job
    # flipped the whole run to `cancelled`, so `version.yml` skipped and the
    # dev→main promotion never published `@latest` (stuck since ~2026-05-31).
    # The PR-time GitGuardian App check remains the enforcing gate.
    continue-on-error: true

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: GitGuardian/ggshield-action@7059aef1ffb7d2374ce27201144f5613beecefe0 # v1
        continue-on-error: true
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: main
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  quality-gate:
    name: Quality Gate (typecheck + lint + test)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Release, immutable pin, and Helm contract gate
        shell: bash
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/release-contract-tools"
          mkdir -p "${tools}/helm" "${tools}/actionlint"

          helm_archive="${tools}/helm/helm-v3.16.4-linux-amd64.tar.gz"
          curl -fsSLo "${helm_archive}" https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz
          printf '%s  %s\n' fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179 "${helm_archive}" | sha256sum -c -
          tar -xzf "${helm_archive}" -C "${tools}/helm"

          actionlint_archive="${tools}/actionlint/actionlint_1.7.7_linux_amd64.tar.gz"
          curl -fsSLo "${actionlint_archive}" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          printf '%s  %s\n' 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757 "${actionlint_archive}" | sha256sum -c -
          tar -xzf "${actionlint_archive}" -C "${tools}/actionlint" actionlint

          scripts/release/release-workflow-contract.test.sh
          scripts/release/stable-release-order.test.sh
          scripts/release/pin-production-image.test.sh
          scripts/release/verify-oci-release.test.sh
          scripts/release/verify-release-source.test.sh
          scripts/release/verify-release-assets.test.sh
          scripts/release/verify-orchestrator-run.test.sh
          scripts/release/verify-npm-stable-state.test.sh
          scripts/release/verify-npm-artifact.test.sh
          scripts/release/reconcile-npm-stable.test.sh
          scripts/release/verify-remote-tag.test.sh
          scripts/release/verify-tag-ruleset.test.sh
          scripts/release/verify-oci-alias.test.sh
          scripts/release/classify-image-change.test.sh
          scripts/release/authorize-release-entry.test.sh
          scripts/release/verify-version-only-diff.test.sh
          scripts/release/verify-release-state.test.sh
          HELM_BIN="${tools}/helm/linux-amd64/helm" scripts/ci/test-helm-image-digest.sh
          "${tools}/actionlint/actionlint" \
            .github/workflows/image-publish.yml \
            .github/workflows/version.yml \
            .github/workflows/release.yml \
            .github/workflows/release-publish.yml \
            .github/workflows/build-tarballs.yml \
            .github/workflows/sign-attest.yml \
            .github/workflows/ci.yml

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Turbo remote cache
        uses: rharkor/caching-for-turbo@35a1f2e1570392a7fc1c03552acaf6340f0c5eef # v2.2.1

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache NATS binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: bin/
          key: nats-${{ runner.os }}-${{ hashFiles('scripts/ensure-nats.sh') }}

      - name: Install dependencies
        run: bun install

      - name: Verify version sync
        run: bun scripts/verify-versions.ts

      - name: Setup environment
        run: |
          cp .env.example .env
          sed -i 's/localhost:8432/localhost:5432/g; s/PGSERVE_PORT=8432/PGSERVE_PORT=5432/' .env

      - name: Download NATS
        run: ./scripts/ensure-nats.sh

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Install autopg v3
        # Use the current canonical pgserve distribution. `bunx pgserve@...`
        # installs the legacy npm wrapper; Omni's runtime resolver prefers
        # `autopg` v3 and only falls back to `pgserve` for old hosts.
        # The installer verifies release attestations via gh/cosign; gh needs
        # GH_TOKEN in Actions to make the verification API call. It also starts
        # an autopg-server PM2 process on the default port. Reuse that server
        # in CI instead of racing a second `autopg serve` against the same
        # embedded Postgres binary cache (ETXTBSY).
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOPG_VERSION: v3.0.7
        run: |
          bun add -g pm2
          curl -fsSL https://raw.githubusercontent.com/automagik-dev/autopg/main/install.sh | bash

      - name: Start NATS
        run: ./bin/nats-server -js -p 4222 &

      - name: Wait for database
        run: |
          for _ in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 >/dev/null 2>&1; then
              echo "Database ready" && exit 0
            fi
            sleep 1
          done
          echo "Database failed to start" && exit 1

      - name: Create omni database
        # autopg v3 is consumer-only: it starts postgres/template DBs, not
        # per-app databases. Create the `omni` DB explicitly for tests.
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE omni"

      - name: Build
        run: bun run build

      - name: Verify build outputs
        run: |
          test -d packages/sdk/dist || (echo "Missing packages/sdk/dist" && exit 1)
          test -d packages/cli/dist || (echo "Missing packages/cli/dist" && exit 1)
          echo "Build outputs verified"

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bunx biome check .

      - name: Dead code check (knip)
        run: bunx knip

      - name: Test
        # Scope to omni packages + the ui app; apps/khal-ui is a decoupled
        # sub-project (private @khal-os deps) with its own test run.
        run: bun test packages apps/ui --env-file=.env
        env:
          NODE_ENV: test

  pg-isolation-gate:
    name: PostgreSQL Isolation Gate (tenancy/RLS)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25

    # WHY A SEPARATE JOB
    # ------------------
    # Every `*-postgres.test.ts` suite in this repository is opt-in on an
    # `OMNI_G{1..4}_POSTGRES_URL` variable and `describe.skip`s itself when the
    # variable is unset. Before this job, no workflow set them, so the tenancy /
    # RLS / two-tenant-adversarial suites — the ones that actually prove tenant
    # containment — skipped on every CI run while CI stayed green. A skipped
    # security test is worse than a missing one, because it looks like coverage.
    #
    # It does NOT reuse the quality gate's autopg service on :5432. The harness
    # (`scripts/disposable-pg-cluster.ts`) is deliberately built to `initdb` its
    # OWN throwaway cluster on a random loopback port with a generated
    # superuser password — it refuses port 5432 outright — because the suites
    # create databases, roles, and RLS policies that must never land in a shared
    # cluster. So this job supplies a postgres SERVER build and lets the gate
    # stand up and tear down its own cluster.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Resolve a PostgreSQL server build
        # `initdb` alone is not enough: a client-only distribution ships initdb
        # and psql but no `postgres`, and initdb then dies halfway through. The
        # harness applies the same postgres-next-to-initdb test, so apply it
        # here and install only when the runner image does not already satisfy
        # it. OMNI_PG_BIN_DIR is exported so the harness never has to guess.
        run: |
          set -euo pipefail
          find_bin_dir() {
            for dir in /usr/lib/postgresql/*/bin; do
              if [ -x "$dir/postgres" ] && [ -x "$dir/initdb" ]; then echo "$dir"; return 0; fi
            done
            return 1
          }
          if ! BIN_DIR=$(find_bin_dir); then
            echo "No PostgreSQL server build on the runner — installing one."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql postgresql-client
            BIN_DIR=$(find_bin_dir)
          fi
          echo "Using PostgreSQL server build at $BIN_DIR"
          "$BIN_DIR/postgres" --version
          echo "OMNI_PG_BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"
          # The suites shell out to psql, and `resolvePgBinaries` looks for it
          # inside OMNI_PG_BIN_DIR first. A server build that ships no client
          # (some embedded distributions do exactly this) then makes every suite
          # fail with ENOENT rather than skip — loud, but for the wrong reason.
          # Pin the client explicitly when the server dir does not carry one.
          if [ ! -x "$BIN_DIR/psql" ]; then
            PSQL=$(command -v psql)
            echo "Server build has no psql; using client at $PSQL"
            echo "OMNI_PG_PSQL_BIN=$PSQL" >> "$GITHUB_ENV"
          fi

      - name: Stop any distro-started cluster
        # The apt package starts a cluster on :5432 under the `postgres` user.
        # The gate never uses it, and leaving it running only invites a suite to
        # find a shared server by accident. Best-effort: absent unit = fine.
        run: sudo systemctl stop postgresql || true

      - name: Real-PostgreSQL isolation gate
        # `make test-pg-gate` → `bun scripts/pg-gate.ts`, which creates the
        # disposable cluster, exports EVERY opt-in URL variable from it so no
        # suite can skip, runs the suites, and FAILS when a server is
        # unavailable, when any test skipped, when zero tests passed, or when
        # the number of files that ran differs from the number of
        # `*-postgres.test.ts` files it discovered. Adding a new suite without
        # wiring it therefore fails the gate rather than silently skipping.
        #
        # No `--env-file`: the gate must never touch an ambient DATABASE_URL.
        run: make test-pg-gate

  remote-media-tests:
    name: Remote Media (S3/MinIO integration)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Setup environment
        run: |
          cp .env.example .env
          sed -i 's/localhost:8432/localhost:5432/g; s/PGSERVE_PORT=8432/PGSERVE_PORT=5432/' .env

      - name: Test (S3/MinIO integration suites)
        # The shared MinIO harness (packages/api/src/__tests__/minio-harness.ts)
        # docker-runs its OWN `minio/minio` container on a random high port, so
        # no `services:` container or endpoint env is needed — only Docker on
        # the runner plus the `MINIO_INTEGRATION=1` opt-in. Without that flag
        # the suites deterministically skip whenever `CI=true` (PR #770 H8).
        # These suites use mocked DBs and no NATS, so this job skips the
        # autopg/NATS bring-up the quality gate needs.
        shell: bash
        env:
          NODE_ENV: test
          MINIO_INTEGRATION: '1'
        run: |
          bun test --env-file=.env \
            packages/api/src/services/__tests__/s3-backend-remote.test.ts \
            packages/api/src/services/__tests__/batch-jobs-remote.test.ts \
            packages/api/src/plugins/__tests__/media-remote-e2e.test.ts \
            packages/api/src/plugins/__tests__/media-processor-remote.test.ts \
            packages/api/src/plugins/__tests__/agent-dispatcher-media-remote.test.ts \
            2>&1 | tee remote-media-tests.log

      - name: Verify suites executed (not skipped)
        # Guard against the H8 regression: with the MinIO gate closed the run
        # still exits 0 — every test skips ("0 pass") and no real S3 backend is
        # ever constructed. Demand positive evidence of execution so a silent
        # re-skip (renamed opt-in env, Docker gone from the runner) fails
        # loudly instead of reporting a green no-op.
        run: |
          if ! grep -q "Initialized S3 media backend" remote-media-tests.log; then
            echo "::error::No S3 backend was constructed — the S3/MinIO suites did not execute (PR #770 H8)"
            exit 1
          fi
          if grep -qE "^ 0 pass" remote-media-tests.log; then
            echo "::error::0 tests passed — the S3/MinIO suites were skipped, not executed (PR #770 H8)"
            exit 1
          fi
          echo "S3/MinIO suites executed against a real MinIO (S3 backend init lines + non-zero pass count present)"

  smoke-test:
    name: Smoke Test (Fresh Environment)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Turbo remote cache
        uses: rharkor/caching-for-turbo@35a1f2e1570392a7fc1c03552acaf6340f0c5eef # v2.2.1

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache NATS binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: bin/
          key: nats-${{ runner.os }}-${{ hashFiles('scripts/ensure-nats.sh') }}

      - name: Install dependencies
        run: bun install

      - name: Setup environment
        run: |
          cp .env.example .env
          sed -i 's/localhost:8432/localhost:5432/g; s/PGSERVE_PORT=8432/PGSERVE_PORT=5432/' .env

      - name: Download NATS
        run: ./scripts/ensure-nats.sh

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Install autopg v3
        # Use the current canonical pgserve distribution. `bunx pgserve@...`
        # installs the legacy npm wrapper; Omni's runtime resolver prefers
        # `autopg` v3 and only falls back to `pgserve` for old hosts.
        # The installer verifies release attestations via gh/cosign; gh needs
        # GH_TOKEN in Actions to make the verification API call. It also starts
        # an autopg-server PM2 process on the default port. Reuse that server
        # in CI instead of racing a second `autopg serve` against the same
        # embedded Postgres binary cache (ETXTBSY).
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOPG_VERSION: v3.0.7
        run: |
          bun add -g pm2
          curl -fsSL https://raw.githubusercontent.com/automagik-dev/autopg/main/install.sh | bash

      - name: Start NATS
        run: ./bin/nats-server -js -p 4222 &

      - name: Wait for database
        run: |
          for _ in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 >/dev/null 2>&1; then
              echo "Database ready" && exit 0
            fi
            sleep 1
          done
          echo "Database failed to start" && exit 1

      - name: Create omni database
        # autopg v3 is consumer-only: it starts postgres/template DBs, not
        # per-app databases. omni-api connects to `…/omni`, so create it
        # explicitly here. In production this is owned by `autopg install`
        # / `omni doctor --fix`.
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE omni"

      - name: Build all packages
        run: bun run build

      - name: Start API
        run: bun packages/api/src/index.ts &
        env:
          OMNI_PACKAGES_DIR: ${{ github.workspace }}/packages
          PGSERVE_EMBEDDED: 'false'

      - name: Wait for API
        run: |
          for _ in $(seq 1 15); do
            if curl --fail --silent http://localhost:8882/api/v2/health > /dev/null 2>&1; then
              echo "API is healthy" && exit 0
            fi
            sleep 2
          done
          echo "API failed to start" && exit 1

      - name: Verify health response
        run: |
          HEALTH=$(curl --fail --silent http://localhost:8882/api/v2/health)
          echo "$HEALTH" | jq .
          STATUS=$(echo "$HEALTH" | jq -r '.status')
          if [ "$STATUS" != "healthy" ]; then
            echo "Health check returned status: $STATUS (expected: healthy)"
            exit 1
          fi

      - name: Verify single API process
        run: |
          PROC_COUNT=$(lsof -ti:8882 | sort -u | wc -l)
          echo "Processes on port 8882: $PROC_COUNT"
          if [ "$PROC_COUNT" -ne 1 ]; then
            echo "Expected 1 process on port 8882, found $PROC_COUNT"
            exit 1
          fi
