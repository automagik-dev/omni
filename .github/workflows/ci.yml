name: CI

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, dev, homolog]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets Scan (GitGuardian)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    # PRs are already covered by the GitGuardian GitHub App check. Keep this
    # action for push-time coverage only; running both on PRs can exhaust the
    # action API quota and produce false red CI despite the app passing.
    if: ${{ github.event_name == 'push' }}
    # NON-BLOCKING: a GitGuardian failure/cancellation (e.g. a missing/invalid
    # GITGUARDIAN_API_KEY or quota exhaustion) must NOT poison the overall CI
    # run conclusion. The `version.yml` auto-release gates on the main-push CI
    # run concluding `success`; before this guard, a cancelled secrets-scan job
    # flipped the whole run to `cancelled`, so `version.yml` skipped and the
    # dev→main promotion never published `@latest` (stuck since ~2026-05-31).
    # The PR-time GitGuardian App check remains the enforcing gate.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: GitGuardian/ggshield-action@v1
        continue-on-error: true
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: main
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  quality-gate:
    name: Quality Gate (typecheck + lint + test)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Turbo remote cache
        uses: rharkor/caching-for-turbo@v2.2.1

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache NATS binary
        uses: actions/cache@v4
        with:
          path: bin/
          key: nats-${{ runner.os }}-${{ hashFiles('scripts/ensure-nats.sh') }}

      - name: Install dependencies
        run: bun install

      - name: Verify version sync
        run: bun scripts/verify-versions.ts

      - name: Setup environment
        run: |
          cp .env.example .env
          sed -i 's/localhost:8432/localhost:5432/g; s/PGSERVE_PORT=8432/PGSERVE_PORT=5432/' .env

      - name: Download NATS
        run: ./scripts/ensure-nats.sh

      - name: Install autopg v3
        # Use the current canonical pgserve distribution. `bunx pgserve@...`
        # installs the legacy npm wrapper; Omni's runtime resolver prefers
        # `autopg` v3 and only falls back to `pgserve` for old hosts.
        # The installer verifies release attestations via gh/cosign; gh needs
        # GH_TOKEN in Actions to make the verification API call. It also starts
        # an autopg-server PM2 process on the default port. Reuse that server
        # in CI instead of racing a second `autopg serve` against the same
        # embedded Postgres binary cache (ETXTBSY).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun add -g pm2
          curl -fsSL https://raw.githubusercontent.com/automagik-dev/autopg/main/install.sh | bash

      - name: Start NATS
        run: ./bin/nats-server -js -p 4222 &

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 >/dev/null 2>&1 && \
              echo "Database ready" && exit 0 || sleep 1
          done
          echo "Database failed to start" && exit 1

      - name: Create omni database
        # autopg v3 is consumer-only: it starts postgres/template DBs, not
        # per-app databases. Create the `omni` DB explicitly for tests.
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE omni"

      - name: Build
        run: bun run build

      - name: Verify build outputs
        run: |
          test -d packages/sdk/dist || (echo "Missing packages/sdk/dist" && exit 1)
          test -d packages/cli/dist || (echo "Missing packages/cli/dist" && exit 1)
          echo "Build outputs verified"

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bunx biome check .

      - name: Dead code check (knip)
        run: bunx knip

      - name: Test
        run: bun test --env-file=.env
        env:
          NODE_ENV: test

  smoke-test:
    name: Smoke Test (Fresh Environment)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Turbo remote cache
        uses: rharkor/caching-for-turbo@v2.2.1

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache NATS binary
        uses: actions/cache@v4
        with:
          path: bin/
          key: nats-${{ runner.os }}-${{ hashFiles('scripts/ensure-nats.sh') }}

      - name: Install dependencies
        run: bun install

      - name: Setup environment
        run: |
          cp .env.example .env
          sed -i 's/localhost:8432/localhost:5432/g; s/PGSERVE_PORT=8432/PGSERVE_PORT=5432/' .env

      - name: Download NATS
        run: ./scripts/ensure-nats.sh

      - name: Install autopg v3
        # Use the current canonical pgserve distribution. `bunx pgserve@...`
        # installs the legacy npm wrapper; Omni's runtime resolver prefers
        # `autopg` v3 and only falls back to `pgserve` for old hosts.
        # The installer verifies release attestations via gh/cosign; gh needs
        # GH_TOKEN in Actions to make the verification API call. It also starts
        # an autopg-server PM2 process on the default port. Reuse that server
        # in CI instead of racing a second `autopg serve` against the same
        # embedded Postgres binary cache (ETXTBSY).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun add -g pm2
          curl -fsSL https://raw.githubusercontent.com/automagik-dev/autopg/main/install.sh | bash

      - name: Start NATS
        run: ./bin/nats-server -js -p 4222 &

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 >/dev/null 2>&1 && \
              echo "Database ready" && exit 0 || sleep 1
          done
          echo "Database failed to start" && exit 1

      - name: Create omni database
        # autopg v3 is consumer-only: it starts postgres/template DBs, not
        # per-app databases. omni-api connects to `…/omni`, so create it
        # explicitly here. In production this is owned by `autopg install`
        # / `omni doctor --fix`.
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE omni"

      - name: Build all packages
        run: bun run build

      - name: Start API
        run: bun packages/api/src/index.ts &
        env:
          OMNI_PACKAGES_DIR: ${{ github.workspace }}/packages
          PGSERVE_EMBEDDED: 'false'

      - name: Wait for API
        run: |
          for i in $(seq 1 15); do
            curl --fail --silent http://localhost:8882/api/v2/health > /dev/null 2>&1 && \
              echo "API is healthy" && exit 0 || sleep 2
          done
          echo "API failed to start" && exit 1

      - name: Verify health response
        run: |
          HEALTH=$(curl --fail --silent http://localhost:8882/api/v2/health)
          echo "$HEALTH" | jq .
          STATUS=$(echo "$HEALTH" | jq -r '.status')
          if [ "$STATUS" != "healthy" ]; then
            echo "Health check returned status: $STATUS (expected: healthy)"
            exit 1
          fi

      - name: Verify single API process
        run: |
          PROC_COUNT=$(lsof -ti:8882 | sort -u | wc -l)
          echo "Processes on port 8882: $PROC_COUNT"
          if [ "$PROC_COUNT" -ne 1 ]; then
            echo "Expected 1 process on port 8882, found $PROC_COUNT"
            exit 1
          fi
