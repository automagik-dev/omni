name: Version

# Release state machine:
#   merged PR -> dev: create exactly one version commit on dev, tag that commit,
#                     and build immutable candidates from the tag
#   merged PR dev -> main: verify the promoted tree equals that tag and advance
#                          stable pointers without rebuilding or re-versioning
# Commit messages are deliberately not an input to either transition.

on:
  pull_request:
    types: [closed]
    branches: [dev, main]

permissions:
  contents: write
  actions: write

concurrency:
  # One state transition at a time. In particular, a new dev cut must not
  # race the stable pointer synchronization back to dev.
  group: version-release-state
  cancel-in-progress: false

jobs:
  tag-policy-preflight:
    name: Verify immutable tag policy before versioning
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require policy-read credential and immutable v-tag ruleset
        env:
          # Fine-grained PAT or GitHub App token with repository Administration:read.
          # GITHUB_TOKEN cannot read complete ruleset bypass actor details.
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN}" ]] || {
            echo "::error::RELEASE_POLICY_READ_TOKEN with repository Administration:read is required before creating a release tag"
            exit 1
          }
          RULESETS="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/rulesets")"
          IDS="$(jq -r '.[] | select(.target == "tag" and .enforcement == "active") | .id' <<<"${RULESETS}")"
          [[ -n "${IDS}" ]] || {
            echo "::error::an active tag ruleset is required before versioning"
            exit 1
          }
          VERIFIED=false
          while read -r id; do
            [[ -n "${id}" ]] || continue
            DETAIL="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/rulesets/${id}")"
            if jq -e '
              .target == "tag" and
              .enforcement == "active" and
              (.conditions.ref_name.include | type == "array" and
                any(. == "refs/tags/v*")) and
              (.conditions.ref_name.exclude | type == "array" and
                all(. != "refs/tags/v*" and . != "refs/tags/**" and . != "~ALL")) and
              (.rules | type == "array") and
              ([.rules[].type] | index("update") != null and index("deletion") != null) and
              (has("bypass_actors") and (.bypass_actors | type == "array")) and
              ([.bypass_actors[] |
                select(.actor_type != "OrganizationAdmin" or
                       .actor_id != 1 or
                       .bypass_mode != "always")] | length == 0) and
              ([.bypass_actors[] |
                select(.actor_type == "OrganizationAdmin" and
                       .actor_id == 1 and
                       .bypass_mode == "always")] | length == 1)
            ' <<<"${DETAIL}" >/dev/null; then
              VERIFIED=true
              break
            fi
          done <<<"${IDS}"
          [[ "${VERIFIED}" == "true" ]] || {
            echo "::error::refs/tags/v* must deny update/deletion with only OrganizationAdmin actor_id=1 break-glass"
            exit 1
          }

  dev-version:
    name: Create immutable dev version
    needs: tag-policy-preflight
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      mode: ${{ steps.release.outputs.mode }}
      source_tag: ${{ steps.release.outputs.source_tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      authorization_event: ${{ steps.release.outputs.authorization_event }}
      authorization_sha: ${{ steps.release.outputs.authorization_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: dev
          fetch-depth: 0
          # A PAT is required because GitHub deliberately suppresses workflows
          # for tag pushes made with GITHUB_TOKEN. The annotated tag is the
          # immutable dev-release event and must trigger release.yml at the tag
          # ref so signing identity remains tag-bound.
          token: ${{ secrets.VERSION_BUMP_PAT }}

      - name: Require release event credential
        env:
          VERSION_BUMP_PAT: ${{ secrets.VERSION_BUMP_PAT }}
        run: |
          [[ -n "${VERSION_BUMP_PAT}" ]] || {
            echo "::error::VERSION_BUMP_PAT is required for an observable atomic branch+tag push"
            exit 1
          }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate structured merge authorization
        id: authorization
        env:
          AUTHORIZATION_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          [[ "${AUTHORIZATION_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::pull request merge_commit_sha must be a full SHA"
            exit 1
          }
          git fetch --force origin dev 'refs/tags/v*:refs/tags/v*'
          git reset --hard origin/dev
          if [[ "$(git rev-parse origin/dev)" != "${AUTHORIZATION_SHA}" ]]; then
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "::notice::a newer reviewed merge superseded ${AUTHORIZATION_SHA}; its event owns the next cut"
            exit 0
          fi
          echo "authorized=true" >> "$GITHUB_OUTPUT"

      - name: Detect an already-versioned tip
        if: steps.authorization.outputs.authorized == 'true'
        id: existing
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          TAG="v${VERSION}"
          if [[ "$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}" 2>/dev/null || true)" == "$(git rev-parse HEAD)" ]]; then
            echo "already_versioned=true" >> "$GITHUB_OUTPUT"
            echo "::notice::origin/dev already points at immutable ${TAG}; no duplicate cut"
          else
            echo "already_versioned=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_versioned != 'true'
        run: bun install

      - name: Configure git
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_versioned != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Derive collision-free version
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_versioned != 'true'
        id: version
        run: |
          set -euo pipefail
          TODAY="$(date -u +%y%m%d)"
          BUILD_NUMBER=1
          while git rev-parse -q --verify "refs/tags/v2.${TODAY}.${BUILD_NUMBER}^{commit}" >/dev/null; do
            BUILD_NUMBER=$((BUILD_NUMBER + 1))
          done
          VERSION="2.${TODAY}.${BUILD_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Generate synchronized version state
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_versioned != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OMNI_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          bun scripts/generate-version.ts
          bun scripts/sync-versions.ts "${VERSION}"
          bunx biome format --write package.json packages/*/package.json apps/*/package.json
          bun install

          # Keep the dev pointer in the tagged tree. This is required for exact
          # tree promotion: release-time pointer commits must never make main
          # differ from the selected source tag.
          mkdir -p .well-known
          jq -n \
            --arg version "${VERSION}" \
            --arg released_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}" \
            '{
              schema_version: 1,
              channel: "dev",
              version: $version,
              released_at: $released_at,
              tarball_base: $base,
              platforms: ["linux-x64-glibc", "linux-x64-musl", "linux-arm64", "darwin-arm64"]
            }' > .well-known/dev.json

      - name: Commit, tag, and atomically publish the source
        if: steps.authorization.outputs.authorized == 'true' && steps.existing.outputs.already_versioned != 'true'
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          AUTHORIZATION_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git add -A '*.json' bun.lock deploy/helm/omni/Chart.yaml .well-known/dev.json
          git diff --cached --quiet && {
            echo "::error::version generation produced no reviewed state change"
            exit 1
          }
          git commit -m "chore(version): bump to ${VERSION}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TAG="v${VERSION}"
          git tag -a "${SOURCE_TAG}" "${SOURCE_SHA}" \
            -m "Omni dev release ${SOURCE_TAG}" \
            -m "authorization_event=pull_request" \
            -m "authorization_sha=${AUTHORIZATION_SHA}"

          # One transaction prevents a tag without its dev commit (or vice
          # versa). A non-fast-forward race fails closed and is recovered by a
          # later merged PR or the protected recovery path.
          git push --atomic origin \
            "${SOURCE_SHA}:refs/heads/dev" \
            "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"

          [[ "$(git rev-parse "${SOURCE_TAG}^{commit}")" == "${SOURCE_SHA}" ]]
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "source_tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Export release tuple
        id: release
        env:
          ALREADY_VERSIONED: ${{ steps.existing.outputs.already_versioned }}
          AUTHORIZED: ${{ steps.authorization.outputs.authorized }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_TAG: ${{ steps.commit.outputs.source_tag }}
          SOURCE_SHA: ${{ steps.commit.outputs.source_sha }}
          AUTHORIZATION_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [[ "${AUTHORIZED}" != "true" || "${ALREADY_VERSIONED}" == "true" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "should_release=true"
            echo "version=${VERSION}"
            echo "channel=dev"
            echo "mode=build"
            echo "source_tag=${SOURCE_TAG}"
            echo "source_sha=${SOURCE_SHA}"
            echo "authorization_event=pull_request"
            echo "authorization_sha=${AUTHORIZATION_SHA}"
          } >> "$GITHUB_OUTPUT"

  stable-promotion:
    name: Authorize exact-tree stable promotion
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.source.outputs.version }}
      channel: ${{ steps.source.outputs.channel }}
      mode: ${{ steps.source.outputs.mode }}
      source_tag: ${{ steps.source.outputs.source_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      authorization_event: ${{ steps.source.outputs.authorization_event }}
      authorization_sha: ${{ steps.source.outputs.authorization_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Resolve and validate promoted source
        id: source
        env:
          AUTHORIZATION_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          [[ "${AUTHORIZATION_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch --force origin 'refs/tags/v*:refs/tags/v*'
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          SOURCE_TAG="v${VERSION}"
          SOURCE_SHA="$(git rev-parse "${SOURCE_TAG}^{commit}")"
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse "${SOURCE_SHA}^{tree}")" == "$(git rev-parse "${AUTHORIZATION_SHA}^{tree}")" ]] || {
            echo "::error::promoted main tree is not exactly ${SOURCE_TAG}; refusing rebuild/re-version"
            exit 1
          }
          {
            echo "version=${VERSION}"
            echo "channel=stable"
            echo "mode=promote"
            echo "source_tag=${SOURCE_TAG}"
            echo "source_sha=${SOURCE_SHA}"
            echo "authorization_event=pull_request"
            echo "authorization_sha=${AUTHORIZATION_SHA}"
          } >> "$GITHUB_OUTPUT"

  release-stable:
    name: Promote verified candidates
    needs: stable-promotion
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      packages: write
      actions: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      version: ${{ needs.stable-promotion.outputs.version }}
      channel: ${{ needs.stable-promotion.outputs.channel }}
      mode: ${{ needs.stable-promotion.outputs.mode }}
      source_tag: ${{ needs.stable-promotion.outputs.source_tag }}
      source_sha: ${{ needs.stable-promotion.outputs.source_sha }}
      authorization_event: ${{ needs.stable-promotion.outputs.authorization_event }}
      authorization_sha: ${{ needs.stable-promotion.outputs.authorization_sha }}
      recovery: false

  # The reusable release workflow owns the manual workflow_dispatch entry.
  # Its recovery gate uses the protected `release-recovery` environment and
  # requires the complete tuple; there is intentionally no branch/tag fallback.
