name: Version

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # This workflow always writes to `dev`, regardless of the trigger ref.
  group: version-dev
  cancel-in-progress: false

jobs:
  auto-version:
    name: Auto Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'dev' &&
       !contains(github.event.workflow_run.head_commit.message, '[skip ci]') &&
       startsWith(github.event.workflow_run.head_commit.message, 'Merge pull request'))

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # This workflow always writes to `dev`. Always base version bumps on the latest `dev` to avoid
          # non-fast-forward races when triggered via workflow_run (detached HEAD by SHA).
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3  # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Derive version
        id: version
        run: |
          TODAY=$(date -u +%Y%m%d)
          EXISTING=$(git tag --list "v2.${TODAY}.*" | wc -l)
          BUILD_NUMBER=$((EXISTING + 1))
          VERSION="2.${TODAY}.${BUILD_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Derived version: ${VERSION}"

      - name: Generate version.json
        run: bun scripts/generate-version.ts
        env:
          OMNI_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}

      - name: Sync package.json versions
        run: bun scripts/sync-versions.ts ${{ steps.version.outputs.version }}

      - name: Format versioned JSON (Biome)
        run: |
          # Auto-version modifies JSON; enforce Biome formatting before lint runs in other workflows.
          bunx biome format --write package.json packages/*/package.json apps/*/package.json

      - name: Commit and tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git add -A '*.json'
          if git diff --cached --quiet; then
            echo "No package.json changes to commit"
          else
            git commit -m "chore(version): bump to ${VERSION} [skip ci]"
          fi

          git tag "v${VERSION}"
          # When triggered via workflow_run we checkout by SHA (detached HEAD). Push the current commit to `dev`
          # explicitly so the version bump commit and its tag are both reachable from the branch.
          git push --atomic origin HEAD:refs/heads/dev "refs/tags/v${VERSION}"
