name: Version

on:
  # Fire directly when an in-repository PR merges to dev. Stable main versions
  # are fixed in their reviewed dev-to-main promotion and are never bumped
  # after merge.
  pull_request:
    types: [closed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Cut a stable candidate tag: skip the dev prerelease so image-build.yml can publish the stable release'
        type: boolean
        default: false
      stable_publish_only:
        description: 'Publish one already verified stable tag to npm without creating a new version'
        type: boolean
        default: false
      expected_version:
        description: 'Stable-only: exact version without the v prefix'
        required: false
        type: string
      expected_sha:
        description: 'Stable-only: exact 40-character release source SHA'
        required: false
        type: string
      expected_digest:
        description: 'Stable-only: exact verified omni-api OCI digest'
        required: false
        type: string
      orchestrator_run_id:
        description: 'Stable-only: exact in-progress image-build workflow run'
        required: false
        type: string
      orchestrator_control_sha:
        description: 'Stable-only: exact control revision executing image-build'
        required: false
        type: string

permissions: {}

# Concurrency is declared per job, not workflow-wide: the two jobs have
# different write targets, so one shared key cannot be correct for both.

jobs:
  auto-version:
    name: Auto Version
    # Serialize every writer to `dev` under one constant group. This job is the
    # only branch writer here and always targets `dev` (checkout_ref/push_ref
    # are hardcoded), on a merged `pull_request` and on `workflow_dispatch`
    # alike. The key therefore must not be derived from the trigger ref: a
    # dispatch started from `main`, a tag, or a feature branch reports that ref
    # in `github.ref_name` and leaves `github.event.pull_request.base.ref`
    # empty, so a ref-keyed group lets such a run bump and tag `dev` concurrently
    # with a merged-PR run.
    #
    # Consequence of the shared group: with `cancel-in-progress: false` a third
    # run joining the group cancels the pending one. That coalescing is the
    # intended outcome, not a loss — the surviving run checks `dev` out fresh
    # and re-derives its version from `git tag --list`, so it absorbs the
    # displaced bump and still dispatches release.yml for its own tag.
    concurrency:
      group: version-dev
      cancel-in-progress: false
    # GitHub-hosted runner (not Blacksmith). The "Upgrade npm for OIDC
    # trusted publishing" step runs `npm install -g npm@latest` which
    # writes to /usr/local — omni's Blacksmith pool image rejects this
    # with EACCES on /usr/local/share/man/man7, blocking the publish
    # step. GitHub-hosted runners give the runner user write access to
    # /usr/local. (Trade-off: slower job startup vs. publish reliability.)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # OIDC token issuance for npm Trusted Publishing — pairs with the
      # "Publish to npm via OIDC" step below.
      id-token: write
      # `gh workflow run release.yml` requires actions:write. Keeping this on
      # the only dispatching job prevents the stable read-only job inheriting it.
      actions: write
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.stable_publish_only != true) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'dev' &&
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Determine channel and npm tag
        id: context
        run: |
          {
            echo "npm_tag=next"
            echo "release_channel=dev"
            echo "checkout_ref=dev"
            echo "push_ref=dev"
          } >> "$GITHUB_OUTPUT"
          echo "Triggering branch: dev"

      - name: Require protected version writer credential
        env:
          VERSION_WRITER_TOKEN: ${{ secrets.VERSION_BUMP_PAT }}
        run: |
          [[ -n "${VERSION_WRITER_TOKEN}" ]] || {
            echo "::error::VERSION_BUMP_PAT is required so version branch pushes trigger their downstream workflows"
            exit 1
          }

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Bump the canonical dev target branch. Stable main versions
          # are fixed in their release PR and never created by this workflow.
          ref: ${{ steps.context.outputs.checkout_ref }}
          fetch-depth: 0
          # The bump push uses a machine-account PAT explicitly in "Commit and
          # tag"; checkout credentials are never persisted in the worktree.
          # Why: bump commits no longer carry the skip-ci token (D8), so each
          # bump push to dev re-fires any OPEN rolling PR's pull_request runs;
          # when the push actor is github-actions[bot], GitHub holds those
          # runs at `action_required`, wedging the PR until a human closes/
          # reopens it. Pushing as a machine account avoids the bot-actor hold.
          # Secret spec: fine-grained PAT on a machine account (e.g.
          # automagik-bot) scoped to automagik-dev/omni, Contents: read+write.
          # NOTE: unlike GITHUB_TOKEN, PAT pushes DO fire on:push workflows.
          # The branch push must use the machine identity so in-repository PRs
          # do not become action_required on a github-actions[bot] update. The
          # v* tag push must NOT use the PAT: see "Commit and tag" below.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Derive version
        id: version
        run: |
          TODAY=$(date -u +%y%m%d)
          EXISTING=$(git tag --list "v2.${TODAY}.*" | wc -l)
          BUILD_NUMBER=$((EXISTING + 1))
          VERSION="2.${TODAY}.${BUILD_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Derived version: ${VERSION}"

      - name: Generate version.json
        run: bun scripts/generate-version.ts
        env:
          OMNI_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}

      - name: Sync versions (package.json + chart appVersion)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bun scripts/sync-versions.ts "${VERSION}"

      - name: Format versioned JSON (Biome)
        run: |
          # Auto-version modifies JSON; enforce Biome formatting before lint runs in other workflows.
          bunx biome format --write package.json packages/*/package.json apps/*/package.json

      - name: Refresh bun.lock (workspace version sync)
        run: |
          # Version bumps touch workspace package.json files; bun.lock pins
          # every workspace package's version explicitly, so leaving it stale
          # makes `bun install --frozen-lockfile` fail in build-tarballs.yml
          # ("lockfile had changes, but lockfile is frozen"). Refresh the
          # lockfile in-place so the bump commit carries a consistent
          # package.json + bun.lock pair. Pure rewrite of workspace deps —
          # no external resolution changes, no network impact.
          bun install

      - name: Commit and tag
        env:
          # The branch and tag pushes deliberately use different credentials.
          GITHUB_TOKEN: ${{ github.token }}
          PUSH_REF: ${{ steps.context.outputs.push_ref }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_WRITER_TOKEN: ${{ secrets.VERSION_BUMP_PAT }}
        run: |
          set -euo pipefail
          [[ "${PUSH_REF}" == "dev" ]]

          # Chart.yaml is listed explicitly: the '*.json' pathspec would
          # silently drop the appVersion stamp sync-versions.ts just wrote,
          # and verify-versions.ts (CI Quality Gate) fails on the drift.
          git add -A '*.json' bun.lock deploy/helm/omni/Chart.yaml
          if git diff --cached --quiet; then
            echo "No version file changes to commit"
          else
            # No [skip ci]: the reviewed dev branch must receive ordinary CI
            # on every version bump.
            git commit -m "chore(version): bump to ${VERSION}"
          fi

          git tag "v${VERSION}"

          # Split push (was --atomic): the two refs need DIFFERENT credentials.
          # Branch push uses the machine PAT explicitly so the push actor is not
          # github-actions[bot] — see the checkout step for why.
          git -c http.https://github.com/.extraheader= \
            push "https://x-access-token:${VERSION_WRITER_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${PUSH_REF}"

          # Tag push stays on GITHUB_TOKEN DELIBERATELY: GITHUB_TOKEN pushes
          # never fire on:push workflows (GitHub anti-recursion), so
          # release.yml runs only via the explicit dispatch step below, which
          # passes the correct channel. A PAT-pushed v* tag would ALSO fire
          # release.yml's push:tags path, where channel falls through to
          # 'stable' — duplicating the release pipeline AND promoting a
          # dev cut to the stable channel. The -c flag blanks the
          # default auth header for this one invocation so the URL-embedded
          # GITHUB_TOKEN wins. Losing --atomic is safe with
          # branch-first ordering: a tag-push failure self-heals on re-run
          # (same derived version → no version-file diff → re-tag HEAD →
          # no-op branch push → tag push retries).
          git -c http.https://github.com/.extraheader= \
            push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/v${VERSION}"

      # Dispatch the signed-tarball release pipeline (build → sign-attest →
      # publish) via release.yml's workflow_dispatch entry. GITHUB_TOKEN-
      # pushed tags don't fire push:tags workflows (GitHub anti-recursion
      # guard); workflow_dispatch and repository_dispatch are the documented
      # exceptions, so this step kicks the orchestrator from version.yml.
      #
      - name: Build CLI
        run: bunx turbo run build --filter=@automagik/omni

      - name: Setup Node 24 (for npm OIDC publish)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm via OIDC (@${{ steps.context.outputs.npm_tag }})
        env:
          DIST_TAG: ${{ steps.context.outputs.npm_tag }}
          HUSKY: "0"
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          cd packages/cli
          npm publish --access public --tag "${DIST_TAG}"

      # Dispatch the signed-tarball release pipeline (build → sign-attest →
      # publish) via release.yml's workflow_dispatch entry. GITHUB_TOKEN-
      # pushed tags don't fire push:tags workflows (GitHub anti-recursion
      # guard); workflow_dispatch and repository_dispatch are the documented
      # exceptions, so this step kicks the orchestrator from version.yml.
      #
      # NOTE: this step runs LAST so a dispatch failure never short-circuits
      # the npm publish step. The historical HTTP 403 (GITHUB_TOKEN lacking
      # workflow-write) is now fixed by `actions: write` on this job, so this
      # normally succeeds and the GitHub Release
      # fires automatically. `continue-on-error: true` is kept as a safety net:
      # any residual dispatch failure becomes a workflow annotation and the
      # operator can manually re-dispatch via `gh workflow run release.yml ...`.
      # Pre-fix history: when dispatch ran BEFORE npm publish + Build CLI,
      # the 403 cascaded and skipped npm publish entirely (v2.260520.1 / .2
      # / .3 never made it to @next).
      #
      # `candidate=true` (workflow_dispatch only; a merged PR never sets it)
      # skips this dispatch entirely. A dev prerelease at v<version> would
      # otherwise pin the tag's channel classification to dev forever
      # (verify-release-state.py: "channel classification is immutable"), so
      # image-build.yml could never publish the stable release at that tag.
      # The npm `next` publish above still happens for a candidate cut.
      - name: Dispatch release pipeline for the new tag
        continue-on-error: true
        env:
          CANDIDATE: ${{ inputs.candidate }}
          CHANNEL: ${{ steps.context.outputs.release_channel }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="refs/tags/v${VERSION}"
          TAG_SHA=$(git rev-parse "${TAG}^{commit}")
          [[ "${TAG_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${CANDIDATE}" == "true" ]]; then
            echo "candidate=true: skipping the dev prerelease dispatch; ${TAG} is reserved for image-build.yml (gh workflow run image-build.yml --ref ${TAG} -f version=${VERSION})"
            exit 0
          fi
          echo "Dispatching release pipeline against ${TAG} (channel=${CHANNEL})..."
          if ! gh workflow run release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${TAG}" \
            --field version="${VERSION}" \
            --field channel="${CHANNEL}" \
            --field expected_sha="${TAG_SHA}"; then
            echo "::error ::release-trigger.dispatch_failed release.yml dispatch failed for ${TAG} — investigate gh CLI auth or workflow availability before re-running manually"
            exit 1
          fi

  publish-stable:
    name: Publish verified stable npm package
    # Read-only: republishes one already-verified stable version and never
    # writes a branch or tag, so it must not queue behind (or displace) a `dev`
    # bump. Keyed per version so repeat dispatches for the same version still
    # serialize against each other.
    concurrency:
      group: version-stable-publish-${{ inputs.expected_version }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.stable_publish_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      actions: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Authorize verified stable orchestration
        env:
          ACTOR: ${{ github.actor }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          ORCHESTRATOR_CONTROL_SHA: ${{ inputs.orchestrator_control_sha }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/omni-api
        run: |
          set -euo pipefail
          [[ "${ACTOR}" == "github-actions[bot]" ]]
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${ORCHESTRATOR_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${ORCHESTRATOR_CONTROL_SHA}" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ORCHESTRATOR_RUN_ID}" > "${RUNNER_TEMP}/orchestrator.json"
          scripts/release/verify-orchestrator-run.py \
            --run-json "${RUNNER_TEMP}/orchestrator.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --source-sha "${ORCHESTRATOR_CONTROL_SHA}" \
            --expected-workflow .github/workflows/image-build.yml \
            --allowed-event workflow_dispatch
          gh attestation verify "oci://${IMAGE}@${EXPECTED_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --source-digest "${EXPECTED_SHA}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/image-build.yml"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.expected_sha }}
          path: .stable-source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify immutable stable identity
        working-directory: .stable-source
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse 'HEAD^{commit}')" == "${EXPECTED_SHA}" ]]
          [[ "$(git rev-parse "refs/tags/v${EXPECTED_VERSION}^{commit}")" == "${EXPECTED_SHA}" ]]
          [[ "$(node -p "require('./packages/cli/package.json').version")" == "${EXPECTED_VERSION}" ]]

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: .stable-source
        run: bun install --frozen-lockfile

      - name: Build stable CLI
        working-directory: .stable-source
        run: bunx turbo run build --filter=@automagik/omni

      - name: Setup Node 24 for npm trusted publishing
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish or verify existing stable npm package
        working-directory: .stable-source
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          NPM_RECOVERY_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: "0"
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/scripts/release/reconcile-npm-stable.sh" \
            --expected "${EXPECTED_VERSION}" \
            --package-dir "${GITHUB_WORKSPACE}/.stable-source/packages/cli"
