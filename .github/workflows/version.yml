name: Version

on:
  # Fire when a PR merges to dev — the canonical "new thing shipped" event.
  # Prior trigger (workflow_run CI on branch=dev) never fired because CI's
  # `on.push` only lists `[main, homolog]`, never `dev`; merges to dev thus
  # produced no push-event CI run for workflow_run to observe.
  pull_request:
    types: [closed]
    branches: [dev]
  # main-side promotion arrives via CI-on-push (main IS in CI's push
  # branches). Keep this path so release-to-@latest continues to trigger
  # automatically when the rolling PR dev→main merges. homolog branch
  # added 2026-05-12 (Felipe directive) so promotions to homolog also
  # auto-fire the version + release pipeline → .well-known/homolog.json
  # advances. CI's push branches list must include `homolog` for this
  # workflow_run trigger to fire from there.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, homolog]
  workflow_dispatch:

permissions:
  contents: write
  # OIDC token issuance for npm Trusted Publishing — pairs with the
  # "Publish to npm via OIDC" step below. Without this, the publish step
  # gets an empty placeholder token and the registry returns a misleading
  # 404 instead of the real auth failure.
  id-token: write

concurrency:
  # Always writes to `dev` regardless of trigger ref. Keep a single group to serialize.
  group: version-dev
  cancel-in-progress: false

jobs:
  auto-version:
    name: Auto Version
    # GitHub-hosted runner (not Blacksmith). The "Upgrade npm for OIDC
    # trusted publishing" step runs `npm install -g npm@latest` which
    # writes to /usr/local — omni's Blacksmith pool image rejects this
    # with EACCES on /usr/local/share/man/man7, blocking the publish
    # step. GitHub-hosted runners give the runner user write access to
    # /usr/local. (Trade-off: slower job startup vs. publish reliability.)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       !contains(github.event.workflow_run.head_commit.message, '[skip ci]') &&
       startsWith(github.event.workflow_run.head_commit.message, 'Merge pull request') &&
       (contains(github.event.workflow_run.head_commit.message, '/dev') ||
        contains(github.event.workflow_run.head_commit.message, '/homolog')))

    steps:
      - name: Determine channel and npm tag
        id: context
        run: |
          # Branch semantics:
          #   - workflow_run on main → promoted release → @latest
          #   - pull_request merged on dev → new dev build → @next
          #   - workflow_dispatch → defaults to @next (manual dev trigger)
          if [ "${{ github.event_name }}" = "workflow_run" ] && \
             [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "Triggering branch: main → npm tag: latest"
          else
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
            echo "Triggering event: ${{ github.event_name }} → npm tag: next"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Always bump on `dev`. main-triggered runs still push to dev — the rolling dev->main PR
          # carries the bump back to main at release time.
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3  # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Derive version
        id: version
        run: |
          TODAY=$(date -u +%y%m%d)
          EXISTING=$(git tag --list "v2.${TODAY}.*" | wc -l)
          BUILD_NUMBER=$((EXISTING + 1))
          VERSION="2.${TODAY}.${BUILD_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Derived version: ${VERSION}"

      - name: Generate version.json
        run: bun scripts/generate-version.ts
        env:
          OMNI_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}

      - name: Sync package.json versions
        run: bun scripts/sync-versions.ts ${{ steps.version.outputs.version }}

      - name: Format versioned JSON (Biome)
        run: |
          # Auto-version modifies JSON; enforce Biome formatting before lint runs in other workflows.
          bunx biome format --write package.json packages/*/package.json apps/*/package.json

      - name: Refresh bun.lock (workspace version sync)
        run: |
          # Version bumps touch workspace package.json files; bun.lock pins
          # every workspace package's version explicitly, so leaving it stale
          # makes `bun install --frozen-lockfile` fail in build-tarballs.yml
          # ("lockfile had changes, but lockfile is frozen"). Refresh the
          # lockfile in-place so the bump commit carries a consistent
          # package.json + bun.lock pair. Pure rewrite of workspace deps —
          # no external resolution changes, no network impact.
          bun install

      - name: Commit and tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git add -A '*.json' bun.lock
          if git diff --cached --quiet; then
            echo "No package.json or bun.lock changes to commit"
          else
            git commit -m "chore(version): bump to ${VERSION} [skip ci]"
          fi

          git tag "v${VERSION}"
          # When triggered via workflow_run we checkout by SHA (detached HEAD). Push the current commit to `dev`
          # explicitly so the version bump commit and its tag are both reachable from the branch.
          git push --atomic origin HEAD:refs/heads/dev "refs/tags/v${VERSION}"

      # Dispatch the signed-tarball release pipeline (build → sign-attest →
      # publish) via release.yml's workflow_dispatch entry. GITHUB_TOKEN-
      # pushed tags don't fire push:tags workflows (GitHub anti-recursion
      # guard); workflow_dispatch and repository_dispatch are the documented
      # exceptions, so this step kicks the orchestrator from version.yml.
      #
      # Channel selector: main-branch builds publish to stable (the rolling
      # PR dev→main promotion path), everything else publishes to dev.
      # Mirrors genie wish release-channel-dev (PR #2419).
      - name: Build CLI
        run: bunx turbo run build --filter=@automagik/omni

      - name: Setup Node 24 (for npm OIDC publish)
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm via OIDC (@${{ steps.context.outputs.npm_tag }})
        env:
          HUSKY: "0"
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          cd packages/cli
          npm publish --access public --tag ${{ steps.context.outputs.npm_tag }}

      # Dispatch the signed-tarball release pipeline (build → sign-attest →
      # publish) via release.yml's workflow_dispatch entry. GITHUB_TOKEN-
      # pushed tags don't fire push:tags workflows (GitHub anti-recursion
      # guard); workflow_dispatch and repository_dispatch are the documented
      # exceptions, so this step kicks the orchestrator from version.yml.
      #
      # NOTE: this step runs LAST so a failed dispatch (e.g. GITHUB_TOKEN
      # lacking the workflow-write permission and getting HTTP 403) does
      # not short-circuit the npm publish step. `continue-on-error: true`
      # turns the failure into a workflow annotation; the operator can
      # manually re-dispatch via `gh workflow run release.yml ...`.
      # Pre-fix history: when dispatch ran BEFORE npm publish + Build CLI,
      # the 403 cascaded and skipped npm publish entirely (v2.260520.1 / .2
      # / .3 never made it to @next).
      - name: Dispatch release pipeline for the new tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="refs/tags/v${VERSION}"
          # Determine channel from the triggering branch. The branch
          # semantics here mirror the npm_tag step above:
          #   workflow_run on main → main → stable
          #   pull_request close on dev / workflow_dispatch → dev
          # Canonical channel taxonomy (Felipe directive 2026-05-12,
          # unified across pgserve/omni/genie):
          #   main branch    → stable
          #   homolog branch → homolog
          #   dev branch     → dev (default fallback)
          # The triggering branch comes from workflow_run.head_branch
          # (for the workflow_run trigger path) or stays at the dev
          # default for pull_request close + workflow_dispatch paths.
          TRIGGER_BRANCH=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TRIGGER_BRANCH="${{ github.event.workflow_run.head_branch }}"
          fi
          case "${TRIGGER_BRANCH}" in
            main)    CHANNEL="stable" ;;
            homolog) CHANNEL="homolog" ;;
            *)       CHANNEL="dev" ;;
          esac
          echo "Dispatching release pipeline against ${TAG} (channel=${CHANNEL})..."
          if ! gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}" --field version="${VERSION}" --field channel="${CHANNEL}"; then
            echo "::error ::release-trigger.dispatch_failed release.yml dispatch failed for ${TAG} — investigate gh CLI auth or workflow availability before re-running manually"
            exit 1
          fi

