name: Version

on:
  # Fire directly when a PR merges to dev. Homolog has a single canonical
  # entry point below, after its push CI succeeds, so one merge cannot publish
  # twice through both pull_request and workflow_run.
  # Prior trigger (workflow_run CI on branch=dev) never fired because CI's
  # `on.push` only lists `[main, homolog]`, never `dev`; merges to dev thus
  # produced no push-event CI run for workflow_run to observe.
  pull_request:
    types: [closed]
    branches: [dev]
  # Homolog promotion arrives via CI-on-push. Stable main releases are NOT
  # versioned here: the release PR must already contain its final version, and
  # image-publish.yml finalizes the tag/release only after OCI verification.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [homolog]
  workflow_dispatch:
    inputs:
      stable_publish_only:
        description: 'Publish one already verified stable tag to npm without creating a new version'
        type: boolean
        default: false
      expected_version:
        description: 'Stable-only: exact version without the v prefix'
        required: false
        type: string
      expected_sha:
        description: 'Stable-only: exact 40-character release source SHA'
        required: false
        type: string
      expected_digest:
        description: 'Stable-only: exact verified omni-api OCI digest'
        required: false
        type: string
      orchestrator_run_id:
        description: 'Stable-only: exact in-progress image-publish workflow run'
        required: false
        type: string
      orchestrator_control_sha:
        description: 'Stable-only: exact control revision executing image-publish'
        required: false
        type: string

permissions:
  contents: write
  # OIDC token issuance for npm Trusted Publishing — pairs with the
  # "Publish to npm via OIDC" step below. Without this, the publish step
  # gets an empty placeholder token and the registry returns a misleading
  # 404 instead of the real auth failure.
  id-token: write
  # Workflow-write for the "Dispatch release pipeline" step below: `gh workflow
  # run release.yml` hits the workflow_dispatch API, which requires actions:write.
  # workflow_dispatch is one of the two events GITHUB_TOKEN IS allowed to trigger
  # (with repository_dispatch), so this is sufficient — no PAT needed. Without it
  # the dispatch returns HTTP 403 "Resource not accessible by integration" and the
  # GitHub Release never fires (npm @latest publishes, but the tagged Release does
  # not), forcing a manual `gh workflow run release.yml` after every promotion.
  actions: write

concurrency:
  # Serialize every equivalent entry event by target branch. Keeping event_name
  # out of the key prevents a future trigger expansion from reintroducing
  # concurrent duplicate publication for one branch.
  group: version-${{ github.event.workflow_run.head_branch || github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  auto-version:
    name: Auto Version
    # GitHub-hosted runner (not Blacksmith). The "Upgrade npm for OIDC
    # trusted publishing" step runs `npm install -g npm@latest` which
    # writes to /usr/local — omni's Blacksmith pool image rejects this
    # with EACCES on /usr/local/share/man/man7, blocking the publish
    # step. GitHub-hosted runners give the runner user write access to
    # /usr/local. (Trade-off: slower job startup vs. publish reliability.)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.stable_publish_only != true) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'dev' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'homolog' &&
       !contains(github.event.workflow_run.head_commit.message, '[skip ci]') &&
       startsWith(github.event.workflow_run.head_commit.message, 'Merge pull request') &&
       (contains(github.event.workflow_run.head_commit.message, '/dev') ||
        contains(github.event.workflow_run.head_commit.message, '/homolog')))

    steps:
      - name: Determine channel and npm tag
        id: context
        run: |
          # Branch semantics:
          #   - pull_request merged on dev → new dev build → @next, bump dev
          #   - workflow_run on homolog → canonical HML build → @homolog, bump homolog
          #   - workflow_dispatch → defaults to dev/@next
          TRIGGER_BRANCH="dev"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TRIGGER_BRANCH="${{ github.event.workflow_run.head_branch }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            TRIGGER_BRANCH="${{ github.event.pull_request.base.ref }}"
          fi

          case "${TRIGGER_BRANCH}" in
            homolog)
              echo "npm_tag=homolog" >> "$GITHUB_OUTPUT"
              echo "release_channel=homolog" >> "$GITHUB_OUTPUT"
              echo "checkout_ref=homolog" >> "$GITHUB_OUTPUT"
              echo "push_ref=homolog" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "npm_tag=next" >> "$GITHUB_OUTPUT"
              echo "release_channel=dev" >> "$GITHUB_OUTPUT"
              echo "checkout_ref=dev" >> "$GITHUB_OUTPUT"
              echo "push_ref=dev" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "trigger_branch=${TRIGGER_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Triggering branch: ${TRIGGER_BRANCH}"

      - name: Require protected version writer credential
        env:
          VERSION_WRITER_TOKEN: ${{ secrets.VERSION_BUMP_PAT }}
        run: |
          [[ -n "${VERSION_WRITER_TOKEN}" ]] || {
            echo "::error::VERSION_BUMP_PAT is required so version branch pushes trigger their downstream workflows"
            exit 1
          }

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Bump the canonical dev/homolog target branch. Stable main versions
          # are fixed in their release PR and never created by this workflow.
          ref: ${{ steps.context.outputs.checkout_ref }}
          fetch-depth: 0
          # Machine-account PAT for the bump push (checkout persists this
          # credential, so the branch push in "Commit and tag" inherits it).
          # Why: bump commits no longer carry the skip-ci token (D8), so each
          # bump push to dev re-fires any OPEN rolling PR's pull_request runs;
          # when the push actor is github-actions[bot], GitHub holds those
          # runs at `action_required`, wedging the PR until a human closes/
          # reopens it. Pushing as a machine account avoids the bot-actor hold.
          # Secret spec: fine-grained PAT on a machine account (e.g.
          # automagik-bot) scoped to automagik-dev/omni, Contents: read+write.
          # NOTE: unlike GITHUB_TOKEN, PAT pushes DO fire on:push workflows.
          # Branch push: desired on homolog (image-publish builds the bump
          # commit's image, per D8); CI on the homolog bump is a harmless
          # extra run — Version's workflow_run guard keys on the head-commit
          # MESSAGE, not the actor, and bump messages fail the startsWith
          # 'Merge pull request' check, so no re-fire loop. The v* TAG push
          # must NOT use the PAT: see "Commit and tag" below.
          token: ${{ secrets.VERSION_BUMP_PAT }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Derive version
        id: version
        run: |
          TODAY=$(date -u +%y%m%d)
          EXISTING=$(git tag --list "v2.${TODAY}.*" | wc -l)
          BUILD_NUMBER=$((EXISTING + 1))
          VERSION="2.${TODAY}.${BUILD_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Derived version: ${VERSION}"

      - name: Generate version.json
        run: bun scripts/generate-version.ts
        env:
          OMNI_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}

      - name: Sync versions (package.json + chart appVersion)
        run: bun scripts/sync-versions.ts ${{ steps.version.outputs.version }}

      - name: Format versioned JSON (Biome)
        run: |
          # Auto-version modifies JSON; enforce Biome formatting before lint runs in other workflows.
          bunx biome format --write package.json packages/*/package.json apps/*/package.json

      - name: Refresh bun.lock (workspace version sync)
        run: |
          # Version bumps touch workspace package.json files; bun.lock pins
          # every workspace package's version explicitly, so leaving it stale
          # makes `bun install --frozen-lockfile` fail in build-tarballs.yml
          # ("lockfile had changes, but lockfile is frozen"). Refresh the
          # lockfile in-place so the bump commit carries a consistent
          # package.json + bun.lock pair. Pure rewrite of workspace deps —
          # no external resolution changes, no network impact.
          bun install

      - name: Commit and tag
        env:
          # For the tag push below ONLY — the branch push rides the
          # checkout-persisted credential (VERSION_BUMP_PAT when configured).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Chart.yaml is listed explicitly: the '*.json' pathspec would
          # silently drop the appVersion stamp sync-versions.ts just wrote,
          # and verify-versions.ts (CI Quality Gate) fails on the drift.
          git add -A '*.json' bun.lock deploy/helm/omni/Chart.yaml
          if git diff --cached --quiet; then
            echo "No version file changes to commit"
          else
            # No [skip ci] (D8): homolog bumps MUST trigger image-publish so
            # the stamped appVersion gets a matching image built from the
            # bump commit. Blanket removal is safe on the dev path too — no
            # workflow push-triggers on dev for these paths (CI/image-publish
            # push branches are [main, homolog] only). Loop-safe: this
            # commit's message fails version.yml's own startsWith
            # 'Merge pull request' workflow_run guard.
            git commit -m "chore(version): bump to ${VERSION}"
          fi

          git tag "v${VERSION}"

          # Split push (was --atomic): the two refs need DIFFERENT credentials.
          # Branch push uses the checkout-persisted credential (machine PAT
          # when VERSION_BUMP_PAT is set) so the push actor is not
          # github-actions[bot] — see the checkout step for why.
          git push origin HEAD:refs/heads/${{ steps.context.outputs.push_ref }}

          # Tag push stays on GITHUB_TOKEN DELIBERATELY: GITHUB_TOKEN pushes
          # never fire on:push workflows (GitHub anti-recursion), so
          # release.yml runs only via the explicit dispatch step below, which
          # passes the correct channel. A PAT-pushed v* tag would ALSO fire
          # release.yml's push:tags path, where channel falls through to
          # 'stable' — duplicating the release pipeline AND promoting a
          # dev/homolog cut to the stable channel. The -c flag blanks the
          # checkout-persisted auth header for this one invocation so the
          # URL-embedded GITHUB_TOKEN wins. Losing --atomic is safe with
          # branch-first ordering: a tag-push failure self-heals on re-run
          # (same derived version → no version-file diff → re-tag HEAD →
          # no-op branch push → tag push retries).
          git -c http.https://github.com/.extraheader= \
            push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/v${VERSION}"

      # Dispatch the signed-tarball release pipeline (build → sign-attest →
      # publish) via release.yml's workflow_dispatch entry. GITHUB_TOKEN-
      # pushed tags don't fire push:tags workflows (GitHub anti-recursion
      # guard); workflow_dispatch and repository_dispatch are the documented
      # exceptions, so this step kicks the orchestrator from version.yml.
      #
      # Channel selector is dev/homolog only. Stable is finalized by the
      # verified main image pipeline.
      - name: Build CLI
        run: bunx turbo run build --filter=@automagik/omni

      - name: Setup Node 24 (for npm OIDC publish)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm via OIDC (@${{ steps.context.outputs.npm_tag }})
        env:
          HUSKY: "0"
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          cd packages/cli
          npm publish --access public --tag ${{ steps.context.outputs.npm_tag }}

      # Dispatch the signed-tarball release pipeline (build → sign-attest →
      # publish) via release.yml's workflow_dispatch entry. GITHUB_TOKEN-
      # pushed tags don't fire push:tags workflows (GitHub anti-recursion
      # guard); workflow_dispatch and repository_dispatch are the documented
      # exceptions, so this step kicks the orchestrator from version.yml.
      #
      # NOTE: this step runs LAST so a dispatch failure never short-circuits
      # the npm publish step. The historical HTTP 403 (GITHUB_TOKEN lacking
      # workflow-write) is now fixed by `actions: write` in the top-level
      # permissions block, so this normally succeeds and the GitHub Release
      # fires automatically. `continue-on-error: true` is kept as a safety net:
      # any residual dispatch failure becomes a workflow annotation and the
      # operator can manually re-dispatch via `gh workflow run release.yml ...`.
      # Pre-fix history: when dispatch ran BEFORE npm publish + Build CLI,
      # the 403 cascaded and skipped npm publish entirely (v2.260520.1 / .2
      # / .3 never made it to @next).
      - name: Dispatch release pipeline for the new tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="refs/tags/v${VERSION}"
          CHANNEL="${{ steps.context.outputs.release_channel }}"
          echo "Dispatching release pipeline against ${TAG} (channel=${CHANNEL})..."
          if ! gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}" --field version="${VERSION}" --field channel="${CHANNEL}"; then
            echo "::error ::release-trigger.dispatch_failed release.yml dispatch failed for ${TAG} — investigate gh CLI auth or workflow availability before re-running manually"
            exit 1
          fi

  publish-stable:
    name: Publish verified stable npm package
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.stable_publish_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      actions: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Authorize verified stable orchestration
        env:
          ACTOR: ${{ github.actor }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          ORCHESTRATOR_CONTROL_SHA: ${{ inputs.orchestrator_control_sha }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/omni-api
        run: |
          set -euo pipefail
          [[ "${ACTOR}" == "github-actions[bot]" ]]
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${ORCHESTRATOR_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${ORCHESTRATOR_CONTROL_SHA}" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ORCHESTRATOR_RUN_ID}" > "${RUNNER_TEMP}/orchestrator.json"
          scripts/release/verify-orchestrator-run.py \
            --run-json "${RUNNER_TEMP}/orchestrator.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --source-sha "${ORCHESTRATOR_CONTROL_SHA}"
          gh attestation verify "oci://${IMAGE}@${EXPECTED_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --source-digest "${EXPECTED_SHA}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/image-publish.yml"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.expected_sha }}
          path: .stable-source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify immutable stable identity
        working-directory: .stable-source
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse 'HEAD^{commit}')" == "${EXPECTED_SHA}" ]]
          [[ "$(git rev-parse "refs/tags/v${EXPECTED_VERSION}^{commit}")" == "${EXPECTED_SHA}" ]]
          [[ "$(node -p "require('./packages/cli/package.json').version")" == "${EXPECTED_VERSION}" ]]

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: .stable-source
        run: bun install --frozen-lockfile

      - name: Build stable CLI
        working-directory: .stable-source
        run: bunx turbo run build --filter=@automagik/omni

      - name: Setup Node 24 for npm trusted publishing
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish or verify existing stable npm package
        working-directory: .stable-source
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          NPM_RECOVERY_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: "0"
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/scripts/release/reconcile-npm-stable.sh" \
            --expected "${EXPECTED_VERSION}" \
            --package-dir "${GITHUB_WORKSPACE}/.stable-source/packages/cli"

