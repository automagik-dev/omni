name: autopg Pin

# The sandbox runs Postgres from autopg's GitHub release tarball, pinned by sha256 in
# packages/cli/src/autopg-pin.json, and checks only that sha256 at install. This checks, on every
# change to the pin, that each pinned tarball is the one autopg's release workflow signed:
# cosign verify-blob against the exact identity for the pinned tag, with negative controls.
# See scripts/ci/verify-autopg-pin.sh.

on:
  push:
    branches: [main, dev]
    paths:
      - 'packages/cli/src/autopg-pin.json'
      - 'scripts/ci/verify-autopg-pin.sh'
      - '.github/workflows/autopg-pin.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'packages/cli/src/autopg-pin.json'
      - 'scripts/ci/verify-autopg-pin.sh'
      - '.github/workflows/autopg-pin.yml'

concurrency:
  group: autopg-pin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify-autopg-pin (sha256 + cosign identity)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Verify every pinned autopg tarball
        run: bash scripts/ci/verify-autopg-pin.sh
