    ownership_derivation: no tenant context; must expose no tenant-scoped data unless an explicit privacy contract approves it
    enforcement_target: classify each public endpoint; A2A agent-card scoped by explicit instance only; health/info exposes non-sensitive compat epoch
    migration_rule: audit each unauthenticated endpoint for tenant leakage before RLS release
