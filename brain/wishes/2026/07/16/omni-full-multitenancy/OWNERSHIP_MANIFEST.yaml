  - class: provider_plugin_registry
    disposition: split
    rationale: >-
      In-memory provider/plugin registries and the channel plugin loader hold both platform
      built-ins and tenant-configured entries; tenant A must not resolve tenant B registry entries.
    ownership_derivation: tenant entries keyed by tenant; platform built-ins are catalog
    enforcement_target: tenant-keyed registry lookups; platform catalog read-only
    migration_rule: separate tenant-configured registry state from platform built-ins
    verification_target: tenant A cannot resolve tenant B in-memory registry entries
    evidence: packages/api/src/plugins/loader.ts, packages/core/src/providers/factory.ts
  - class: tenant_egress
    disposition: split
    rationale: >-
      Tenant-controlled outbound egress is UNBOUNDED today. Automation webhook does a raw
      fetch on a tenant-templated URL (core/automations/actions.ts:132,141) with NO SSRF guard;
      provider clients fetch tenant baseUrl. Only media has a partial guard (safe-media-fetch.ts)
      and it has an OMNI_MEDIA_URL_GUARD=off escape hatch.
    ownership_derivation: tenant + actor + integration recorded per egress decision; destinations are tenant-bound policy
    enforcement_target: >-
      single audited default-deny egress broker for ALL tenant egress; block direct fetch/socket from
      routes/providers/plugins/automations/workers; DNS re-resolved+revalidated per hop; reject
      loopback/RFC1918/link-local/metadata/control-plane/non-approved schemes
    migration_rule: route every tenant-controlled URL through the broker; remove per-call escape hatches
    verification_target: SSRF/DNS-rebinding/redirect/metadata tests fail closed; no direct-network bypass
    evidence: packages/core/src/automations/actions.ts:124-141, packages/core/src/providers/{webhook-provider,a2a-client,ag-ui-client,agno-client}.ts, packages/api/src/utils/safe-media-fetch.ts
  - class: credential_bootstrap
    disposition: platform
    rationale: >-
      God/admin key mint. cli/commands/keys.ts admin path creates a profile:'admin' (['*']) key
      directly against the DB (bypassing POST /keys which refuses admin) and prints plaintext
      (keys.ts:116-192). Must be a control-plane operation, never from the tenant data plane.
    ownership_derivation: platform control plane only; explicit owner + purpose + audit (key.admin_created)
    enforcement_target: >-
      separate platform credential class/store; primary-key bootstrap must not create/print a plaintext
      god key from the normal data plane; tenant admins never mint '*'
    migration_rule: unrestricted/god keys migrate to platform credential class with explicit owner+purpose
    verification_target: tenant routes cannot mint '*'; bootstrap does not emit a data-plane god key
    evidence: packages/cli/src/commands/keys.ts:116-192, packages/api/src/services/api-keys.ts, packages/api/src/routes/v2/keys.ts:118-160
  - class: cli_local_state_trust
    disposition: platform
    rationale: >-
      CLI local sentinels (scoped-role.json), host trust/signing context, and the postgres:postgres
      fallback are operator/control-plane state; the runtime NOBYPASSRLS cutover is best-effort and can
      fall back to superuser (role-cutover.ts:194-200,232-235).
    ownership_derivation: operator/control-plane; not tenant-derived
    enforcement_target: >-
      remove the superuser fallback once RLS is a security boundary; runtime startup fails closed if the
      NOBYPASSRLS role is absent; migration/DDL credentials separate and unavailable post-boot
    migration_rule: fail-closed cutover; no postgres:postgres fallback in RLS-enforced states
    verification_target: runtime role verified NOBYPASSRLS; no superuser credential in app process
    evidence: packages/cli/src/lib/role-cutover.ts:194-200,232-235, packages/api/src/middleware/signed-host-scope-context (referenced by scope-enforcer.ts:28), packages/cli/src/commands/trust.ts
  - class: public_bootstrap_surfaces
    disposition: platform
    rationale: >-
      Unauthenticated surfaces (/.well-known/agent-card.json, /.well-known/agent.json, /health,
