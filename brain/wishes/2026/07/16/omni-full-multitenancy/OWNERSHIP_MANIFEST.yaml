# ---------------------------------------------------------------------------
# CALLER-ADJACENT TENANT CONTEXT — mandatory explicit item (WISH/Fable condition).
# ---------------------------------------------------------------------------
caller_adjacent_tenant_context:
  surface: OmniCustomerContext.tenantId / OMNI_TENANT_ID / agent-dispatcher tenantId|tenant_id
  disposition: quarantine
  decision: rename
  rationale: >-
    OmniCustomerContext.tenantId (packages/core/src/providers/types.ts:377) is an OPTIONAL free-form
    string documented as "resolved from person metadata" (types.ts:490-491). It flows
    person.metadata -> customerContextFromRecord (agent-dispatcher.ts:1741-1748, reads tenantId/tenant_id)
    -> customer context -> OMNI_TENANT_ID env exported to the external agent runtime
    (execution-context.ts:75). It is a CALLER/DATA-DERIVED label, never an authenticated value, and MUST
    NOT be confused with the future immutable authenticated tenant_id.
  ownership_derivation: >-
    none today; it is untrusted person-metadata content. It can never establish tenant authority. Any
    genuine account linkage must be DERIVED from the authenticated tenant + a validated account mapping.
  enforcement_target: >-
    rename to a non-authoritative customer/account reference (e.g. OMNI_CUSTOMER_ACCOUNT_REF) so the
    authoritative tenant context established at the G3 auth boundary is namespace-unambiguous; the
    authenticated tenant_id is injected separately by the runtime, never from customer/person metadata.
  migration_rule: >-
    quarantine the field name; do not let any code read tenant authority from it. Introduce the
    authoritative tenant context under a distinct name in G1/G3. Caller-supplied values are ignored for
    isolation decisions.
  verification_target: >-
    static/architecture check that no authorization or RLS path reads OmniCustomerContext.tenantId or
    OMNI_TENANT_ID as tenant authority; adversarial test that a forged person.metadata.tenantId cannot
    select or cross a tenant boundary.
  evidence:
    - packages/core/src/providers/types.ts:373-378
    - packages/core/src/providers/execution-context.ts:72-76
    - packages/api/src/plugins/agent-dispatcher.ts:1741-1748,1778-1781

