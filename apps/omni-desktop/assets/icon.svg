<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The Omni app icon: the octopus (apps/omni-ui-dsh characters.js) on a night-sky tile.
       Source of assets/icon.png (see README, "The icon"). -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a3f"/>
      <stop offset="0.55" stop-color="#070b1d"/>
      <stop offset="1" stop-color="#03050d"/>
    </linearGradient>
    <radialGradient id="violet" cx="0.22" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.84" cy="0.92" r="0.6">
      <stop offset="0" stop-color="#22d3c5" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#22d3c5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ee6d0" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#3ee6d0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3ee6d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a996ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3ee6d0" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ff7ea"/>
      <stop offset="0.45" stop-color="#2fd8c6"/>
      <stop offset="1" stop-color="#0a8a86"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ee6d0" stop-opacity="0"/>
      <stop offset="1" stop-color="#3ee6d0" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feFlood flood-color="#22d3c5" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="22"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sky)"/>
    <g clip-path="url(#tile)">
      <rect x="100" y="100" width="824" height="824" fill="url(#violet)"/>
      <rect x="100" y="100" width="824" height="824" fill="url(#teal)"/>
      <!-- the horizon grid -->
      <g stroke="url(#horizon)" stroke-width="2.5" fill="none">
        <path d="M100 780H924M100 820H924M100 868H924M100 924H924"/>
        <path d="M512 740L512 924M512 740L380 924M512 740L644 924M512 740L240 924M512 740L784 924M512 740L100 900M512 740L924 900"/>
      </g>
      <!-- stars -->
      <g fill="#ffffff">
        <circle cx="236" cy="226" r="4" opacity="0.9"/><circle cx="790" cy="214" r="3" opacity="0.7"/>
        <circle cx="842" cy="372" r="2.5" opacity="0.6"/><circle cx="182" cy="430" r="2.5" opacity="0.55"/>
        <circle cx="300" cy="168" r="2" opacity="0.5"/><circle cx="720" cy="150" r="2" opacity="0.5"/>
        <path d="M786 286l7 19 19 7-19 7-7 19-7-19-19-7 19-7z" opacity="0.85"/>
        <path d="M222 330l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity="0.7"/>
      </g>
      <circle cx="512" cy="500" r="330" fill="url(#halo)"/>
    </g>
    <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="url(#rim)" stroke-width="4"/>
  </g>

  <!-- the octopus, 100-unit art at 5.6x -->
  <g transform="translate(232 206) scale(5.6)">
    <g filter="url(#glow)">
      <path fill="url(#skin)" d="M50 6C75 6 87 24 87 46C87 60 82 68 80 72C84 82 84 92 80 96C76 98 72 92 70 84C68 92 66 98 61 96C57 94 56 84 54 78C52 80 48 80 46 78C44 84 43 94 39 96C34 98 32 92 30 84C28 92 24 98 20 96C16 92 16 82 20 72C18 68 13 60 13 46C13 24 25 6 50 6Z"/>
    </g>
    <path fill="#06706d" opacity="0.5" d="M87 46C87 60 82 68 80 72C84 82 84 92 80 96C76 98 72 92 70 84C68 92 66 98 61 96C57 94 56 84 54 78C62 76 70 66 75 56C80 48 80 36 75 26C82 32 87 38 87 46Z"/>
    <path d="M28 24C34 14 43 10 50 10C40 14 33 21 30 30Z" fill="#ffffff" opacity="0.55"/>
    <ellipse cx="40" cy="37" rx="7" ry="11.5" fill="#06121f"/>
    <ellipse cx="60" cy="37" rx="7" ry="11.5" fill="#06121f"/>
    <circle cx="42.4" cy="31.5" r="2.7" fill="#ffffff"/>
    <circle cx="62.4" cy="31.5" r="2.7" fill="#ffffff"/>
    <circle cx="38.4" cy="42" r="1.2" fill="#7ff7ea" opacity="0.9"/>
    <circle cx="58.4" cy="42" r="1.2" fill="#7ff7ea" opacity="0.9"/>
    <path d="M44 55Q50 60.5 56 55" stroke="#06121f" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <ellipse cx="30.5" cy="51" rx="5" ry="2.8" fill="#ff8cc6" opacity="0.8"/>
    <ellipse cx="69.5" cy="51" rx="5" ry="2.8" fill="#ff8cc6" opacity="0.8"/>
    <g fill="none" stroke="#0a8a86" stroke-width="3" stroke-linecap="round">
      <path d="M20 96Q13 99 12 92"/><path d="M80 96Q87 99 88 92"/>
    </g>
  </g>
</svg>
