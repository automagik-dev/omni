decisions:
  - First-class tenants and immutable tenant context replace instance allowlists as the ownership boundary.
  - Every tenant-owned row has non-null tenant_id, app predicates, composite tenant FKs, and PostgreSQL FORCE RLS.
  - Tenant and platform credentials are separate classes; tenant admins cannot mint platform authority.
  - Tenant context is transaction-local and preserved through HTTP, NATS, jobs, storage, caches, audit, and default-deny outbound egress.
  - Migration is additive until a ledgered writer-fence secure floor, then reconciled, high-water marked, backed up, canaried, and roll-forward safe.
  - Numeric release/revocation/custody thresholds live in RELEASE_SLOS.yaml; missing evidence fails.
  - Production holds require canonical Ed25519-signed receipts from an isolated append-only approval authority, atomically compare-and-consumed by exact action tuple.
  - Production backup, backfill, RLS, release, tenant mapping, and each credential mint require distinct immutable receipts.
