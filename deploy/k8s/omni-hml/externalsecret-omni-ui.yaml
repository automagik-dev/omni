# =============================================================================
# ExternalSecret for the Omni Admin UI (khal-ui) BFF on the shared
# langwatch-hml EKS cluster (namespace omni-hml, sa-east-1).
#
# INERT UNTIL BOTH are true — nothing here changes the running cluster today:
#   1. the SM secret /khal/omni/hml/ui exists (JSON: {"OMNI_API_KEY": "omni_sk_…"}),
#      created out of band (oneform-drivers), AND
#   2. the UI workload is enabled — values-hml-alb.yaml `adminUi.enabled: true`
#      + `adminUi.secret.existingSecret: omni-ui` (see that file's commented
#      "enable later" stanza). The UI ships OFF in this realm, so this Secret is
#      simply unreferenced until then.
#
# Apply (only once the UI is being turned on for HML):
#   kubectl -n omni-hml apply -f deploy/k8s/omni-hml/externalsecret-omni-ui.yaml
#
# Mirrors the omni-db ExternalSecret: same ClusterSecretStore khal-langwatch-hml
# (SecretsManager, sa-east-1; the ESO IAM role has secretsmanager:GetSecretValue
# on /khal/omni/hml/*), same JSON-property convention. The materialized `omni-ui`
# Secret carries OMNI_API_KEY, which the BFF injects as x-api-key server-side —
# the browser never sees it.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omni-ui
  namespace: omni-hml
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: khal-langwatch-hml
  target:
    name: omni-ui
    creationPolicy: Owner
  data:
    - secretKey: OMNI_API_KEY
      remoteRef:
        key: /khal/omni/hml/ui
        property: OMNI_API_KEY
