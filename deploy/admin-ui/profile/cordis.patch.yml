# The Omni Admin UI image's own dsh profile (the same settings the Omni desktop app seeds).
# This dsh is Omni's alone, so it also takes Omni's keyless web search as the default.
- insert:
    - id: web-search-auto
      name: '@automagik/bots-dsh/web-search'
- id: web
  config:
    searchProvider: auto
    fetchProvider: http
# The Omni octopus opens this app (@automagik/welcome-dsh: Welcome, Connect Omni, Connect
# AI), so DSH's own welcome notice and credential step stay off here; DeepSeek's sign-in is
# one of Connect AI's tiles. DSH compares the notice version exactly: it stays a quoted string.
- id: ui-settings-general
  config:
    welcomeNoticeVersion: '2026-09-28.1'
- id: ui-settings-models
  config:
    credentialOnboarding: false
# DSH's plugin market. Linking to an Omni over https adds that Omni's own market
# (<omni>/api/market/index.json): the Omni plugins of its version and the add-ons
# Automagik vetted.
- id: plugin-market
  config:
    indexes: []
# dsh-subscriptions: no local-Ollama fallback, so a chat never moves to another model on its
# own, and nothing probes 127.0.0.1:11434 every minute.
- id: dsh-subscriptions
  config:
    ollamaFallback: false
