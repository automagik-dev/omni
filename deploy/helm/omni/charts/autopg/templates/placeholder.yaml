{{- if .Values.placeholder }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-autopg-placeholder
  labels:
    app.kubernetes.io/name: autopg
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  README: |
    This is the PLACEHOLDER autopg subchart. It provisions NO Postgres.
    Replace deploy/helm/omni/charts/autopg/ with the real autopg chart from
    scratchpad/autopg/deploy/helm/autopg, then set omni's `database.host`
    (or `database.existingSecret`) to the Service/Secret it exposes.
{{- end }}
