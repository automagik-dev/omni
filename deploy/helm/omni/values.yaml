# =============================================================================
# omni umbrella chart — default values
# =============================================================================
# Override with values-dev.yaml (OrbStack) or values-prod.yaml (registry+HPA).
# =============================================================================

nameOverride: ""
fullnameOverride: ""

# ---- omni-api image ---------------------------------------------------------
# Public tags are ghcr.io/automagik-dev/omni-api:v<version>. The chart default
# `tag` is PINNED to the last verified public candidate — the `version` in
# .well-known/latest.json — and is deliberately decoupled from Chart.appVersion:
# appVersion is stamped by version.yml on every dev bump, but no workflow in
# this public repository builds images, so v<Chart.appVersion> is not
# guaranteed to exist in the registry. scripts/ci/test-helm-image-digest.sh
# fails CI when this pin and .well-known/latest.json disagree; move both
# together when a new candidate is verified. tag "" falls back to
# v<Chart.appVersion>. The dev overlay swaps in a locally-built image
# (repository omni-api, tag dev, pullPolicy Never).
image:
  repository: ghcr.io/automagik-dev/omni-api
  tag: "v2.260902.5"
  # Optional immutable OCI index digest. When set, omni-api renders as
  # repository@digest and tag/appVersion are ignored. Only lowercase sha256
  # digests are accepted so GitOps cannot silently deploy a mutable alias.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# ---- replicas + scaling -----------------------------------------------------
# Default: ONE replica, HPA OFF. omni-api persists WhatsApp/Baileys auth state
# in Postgres (no per-pod session file), but a single WhatsApp *credential*
# still maps to ONE live Baileys socket at the protocol level — 2+ replicas
# binding the same credential risk key-ratchet corruption, duplicate sends,
# and session resets that force re-pairing. Until single-socket ownership
# (leader election) exists, scale out ONLY for HTTP/API traffic and
# non-WhatsApp channels, and do so deliberately.
#
# When you do run >1 replica (replicaCount > 1 or autoscaling.enabled), the
# chart automatically adds a PodDisruptionBudget (podDisruptionBudget below)
# and soft pod anti-affinity, and migrate-on-boot serializes via a Postgres
# advisory lock.
replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: ""

# PodDisruptionBudget — rendered only when >1 replica is possible (a
# minAvailable:1 PDB on a single replica would block node drains).
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Stateless → RollingUpdate for zero-downtime rollouts.
strategy:
  type: RollingUpdate

# ---- service ----------------------------------------------------------------
service:
  type: ClusterIP
  port: 8882

# ---- ingress ----------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: omni.local
  path: /
  pathType: Prefix
  tls: []

# ---- app config (non-secret → ConfigMap / plain env) ------------------------
# The containerized API is driven entirely by DATABASE_URL + NATS_URL.
# (PGSERVE_EMBEDDED / NATS_MANAGED are NOT set: embedded pgserve was removed —
# the API only warns if PGSERVE_EMBEDDED=true — and NATS_MANAGED is read only
# by the PM2 ecosystem config, which does not run in the container.)
config:
  API_HOST: "0.0.0.0"
  API_PORT: "8882"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  # TRUSTED_PROXY_HEADER is deliberately NOT set here. This base ships
  # ingress.enabled=false, so the pod may be reached directly and every
  # forwarding header would be caller-controlled — trusting one would let any
  # client choose its own rate-limit bucket. Realm overlays that do front the
  # pod with a proxy (values-dev / values-prod / values-homolog) set it.

# Free-form extra non-secret env (key: value) merged into the ConfigMap.
extraConfig: {}

# ---- env wiring: NATS_URL ---------------------------------------------------
env:
  # NATS_URL — leave empty to derive from the bundled NATS Service (see nats.*),
  # or set explicitly (e.g. nats://my-nats:4222) to point at external NATS.
  natsUrl: ""

# ---- database (autopg) contract ---------------------------------------------
# omni-api needs DATABASE_URL=postgresql://<role>:<pw>@<host>:5432/omni, where
# <role> OWNS the omni tables (migrations ALTER them on boot).
#
# The autopg subchart provisions db `omni` + a scoped owner role and publishes
# Secret `<release>-autopg-app` holding a ready, percent-encoded DATABASE_URL.
# When autopg.enabled and both existingSecret/host below are empty, the chart
# wires omni-api to that Secret AUTOMATICALLY — the defaults just work.
database:
  # Option A: consume a Secret that already holds a full DATABASE_URL. When
  # set, host/user/password below are ignored. Leave empty with autopg.enabled
  # to auto-consume `<release>-autopg-app`.
  existingSecret: ""
  urlKey: "DATABASE_URL"  # key within the Secret holding the URL

  # Option B (chart-assembled URL, stored in the omni Secret; used when
  # existingSecret is empty AND host is set — e.g. an external Postgres):
  host: ""                # external Postgres / autopg Service DNS
  port: 5432
  name: omni
  user: omni              # scoped role that OWNS the omni tables
  password: ""            # set via -f / --set-string (percent-encoded at render)
  sslmode: ""             # e.g. "disable" / "require"; empty → omit

  # TLS server verification (sslmode=verify-full semantics). Point at a
  # ConfigMap carrying the server's CA bundle (e.g. the RDS regional bundle
  # from truststore.pki.rds.amazonaws.com) and the app verifies certificate
  # chain AND hostname — a bare sslmode=require in the URL encrypts but never
  # authenticates the server. Empty → no mount, driver behavior unchanged.
  sslCaConfigMap: ""      # ConfigMap in the release namespace holding the PEM
  sslCaKey: "ca-bundle.pem"  # key within that ConfigMap

# ---- secret (DB creds + optional provider keys) -----------------------------
# There is NO OMNI_API_KEY: omni auth is DB-backed bearer keys (+ optional
# per-instance ed25519 X-Genie-Signature) — API keys live in Postgres rows, not
# env. This Secret carries the assembled DATABASE_URL (Option B above) plus any
# optional third-party credentials, injected via envFrom.
secret:
  # Optional existing Secret to envFrom for extra app env (provider keys, etc.).
  existingSecret: ""
  # Optional key/values minted into the omni Secret and envFrom'd. Leave empty
  # to omit. Common: OPENAI_API_KEY, ANTHROPIC_API_KEY, SENTRY_DSN,
  # OTEL_EXPORTER_OTLP_ENDPOINT.
  env: {}

# ---- probes -----------------------------------------------------------------
# GET /health → 200 {"status":"healthy",...} once DB + NATS are up (5s-cached).
probes:
  # Readiness sheds traffic while the event loop is busy — that is correct and
  # can stay sensitive. Liveness must only kill a HUNG process: a fresh
  # WhatsApp pairing's history sync can starve the loop for minutes (observed
  # in the wild 2026-07-04: liveness killed the pod mid-sync, truncating the
  # one-shot history backfill), so its budget is generous (~5 min).
  readiness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    path: /health
    initialDelaySeconds: 45
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 15
  # Migrations + DB readiness can take 30s+; startupProbe guards slow boots.
  startup:
    path: /health
    periodSeconds: 5
    failureThreshold: 30

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
podSecurityContext:
  # oven/bun image runs as uid 1000 (bun).
  fsGroup: 1000
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []          # raw env entries (list of {name,value}/{name,valueFrom})
extraVolumes: []
extraVolumeMounts: []

# =============================================================================
# Admin UI (khal-ui) — optional second workload
# =============================================================================
# The Omni Admin UI (apps/khal-ui, app id "omni-admin") as a single-container
# pod: one Bun process serves the built SPA AND proxies /omni/* to omni-api,
# injecting the omni_sk_ key server-side so the browser never sees it. Image is
# ghcr.io/automagik-dev/omni-admin-ui. No public workflow builds or pushes it
# today (image-publish.yml is verification-only and image-build.yml mints only
# omni-api); an operator supplies it. OFF by default and in the generic AWS
# overlays; the dev overlay turns it on. On the shared khal.ai realms it stays OFF until a real
# auth layer fronts it — the harness shell mocks a full-admin user, so an open
# ingress would hand anyone reaching the host full control of the omni backend.
adminUi:
  enabled: false
  image:
    repository: ghcr.io/automagik-dev/omni-admin-ui
    tag: ""              # "" => v<Chart.appVersion>, same scheme as omni-api
    pullPolicy: IfNotPresent
  imagePullSecrets: []   # falls back to the top-level imagePullSecrets when empty
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8899           # BFF bind port; drives containerPort + config PORT
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""             # fail-fast when ingress.enabled and empty (set per realm)
    path: /
    pathType: Prefix
    tls: []
  # Non-secret env → the admin-ui ConfigMap. PORT + PUBLIC_DIR are derived by the
  # chart; leave OMNI_BASE_URL empty to target the in-cluster omni-api Service.
  config:
    HOST: "0.0.0.0"
    OMNI_BASE_URL: ""
    BFF_CORS_ORIGINS: ""
  extraConfig: {}
  # OMNI_API_KEY (omni_sk_…) — the BFF's server-side bearer key. Two ways in,
  # both envFrom'd (the browser never sees it):
  #   • existingSecret — an operator/ESO-synced Secret carrying OMNI_API_KEY
  #     (the homolog/prod path; see deploy/k8s/omni-hml/externalsecret-omni-ui.yaml).
  #   • env — inline key/values minted into a chart Secret; supply at deploy time
  #     with `--set adminUi.secret.env.OMNI_API_KEY=omni_sk_…` (the dev path).
  #     NEVER commit a real key here.
  secret:
    existingSecret: ""
    env: {}
  probes:
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 6
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# Subchart / bundled-dependency values
# =============================================================================

# ---- autopg (vendored PostgreSQL 18 subchart) --------------------------------
# The REAL autopg chart is vendored at charts/autopg/ — it is NOT a
# placeholder. It runs Postgres 18 as a single-replica StatefulSet, provisions
# db `omni` + a scoped owner role, and publishes Secret `<release>-autopg-app`
# with a ready DATABASE_URL that this chart auto-consumes (see database.*).
# Its Service is `<release>-autopg:5432`. Full knobs: charts/autopg/values.yaml
# (set them under this `autopg:` key).
#
# SECURITY (read before enabling on a shared cluster): autopg's postmaster
# HARDCODES superuser postgres/postgres and it cannot be rotated (rotation
# crash-loops the pod — see charts/autopg/values.yaml `auth:`). Keeping
# enabled=true therefore assumes (1) a single-tenant cluster/namespace, and
# (2) the NetworkPolicy this chart ships (networkPolicy.enabled below)
# restricting :5432 to omni-api + the provision Job — which only bites on
# CNIs that enforce NetworkPolicy. On shared clusters without enforcement,
# set enabled=false and point database.* at a managed Postgres instead.
autopg:
  enabled: true

# NetworkPolicy around the bundled autopg: allow :5432 ingress only from
# omni-api and autopg's provision Job. Rendered only when autopg.enabled.
networkPolicy:
  enabled: true

# ---- bundled NATS + JetStream ----------------------------------------------
nats:
  enabled: true
  image: nats:2.10-alpine
  port: 4222
  monitorPort: 8222
  externalHost: ""    # used only when nats.enabled=false
  jetstream:
    enabled: true
    memStore: 256Mi
    fileStore: 1Gi
  persistence:
    storageClass: ""
    size: 1Gi
  # StatefulSet PVC retention (JetStream data). Empty {} => omit the field
  # (k8s default Retain/Retain). Self-host overlays may set
  # {whenDeleted: Retain, whenScaled: Retain}.
  persistentVolumeClaimRetentionPolicy: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# ---- media backend (OMNI_MEDIA_*) -------------------------------------------
# Selects the omni-api media storage backend. Mirrors resolveMediaBackendConfig
# in packages/channel-sdk/src/media-backends/config.ts.
#   mode=local  → on-disk storage, no S3 env emitted (default).
#   mode=remote → S3/MinIO; the OMNI_MEDIA_S3_* env is wired from s3.* below.
media:
  mode: local            # "local" | "remote"
  s3:
    # Bucket + addressing. bucket is created idempotently by the MinIO bootstrap
    # (bundled) — for external S3 the bucket must already exist.
    bucket: omni-media
    region: us-east-1
    # MinIO / most self-hosted S3 need path-style addressing; real AWS wants false.
    forcePathStyle: true
    presignTtlSeconds: 3600
    # Endpoint: leave empty to derive from the bundled MinIO Service (when
    # minio.enabled) or to let the AWS SDK derive it from region (real S3). Set
    # explicitly to point at an external S3-compatible endpoint.
    endpoint: ""
    # Optional externally-reachable endpoint used ONLY to presign GET URLs
    # (OMNI_MEDIA_S3_PUBLIC_ENDPOINT). Uploads/reads keep using endpoint above.
    # Set when consumers of presigned URLs (e.g. agents) live outside the
    # cluster and cannot resolve the in-cluster endpoint. Empty → presign with
    # the regular endpoint; no env var is emitted.
    publicEndpoint: ""
    # PROD: reference an existing Secret holding the S3 creds instead of minting
    # them. When set, minio.enabled is typically false and no plaintext creds are
    # rendered. The Secret must contain the two keys below.
    existingSecret: ""
    accessKeyKey: "OMNI_MEDIA_S3_ACCESS_KEY"
    secretKeyKey: "OMNI_MEDIA_S3_SECRET_KEY"
    # IRSA (EKS): source S3 credentials from the pod's web-identity token
    # instead of a Secret. When true the Deployment OMITS the two
    # OMNI_MEDIA_S3_ACCESS_KEY/_SECRET_KEY secretKeyRef envs — the EKS pod
    # identity webhook injects AWS_WEB_IDENTITY_TOKEN_FILE + AWS_ROLE_ARN
    # (from the serviceAccount.annotations `eks.amazonaws.com/role-arn`) and
    # omni-api exchanges that token via STS AssumeRoleWithWebIdentity. Set the
    # role-arn annotation under serviceAccount.annotations when enabling this.
    irsa: false

# ---- bundled MinIO (S3-compatible object store) -----------------------------
# Default OFF in the base values (no unused workload); the dev overlay turns it
# on for a self-contained k8s dev stack. In prod, keep it off and point media.s3
# at a managed bucket via media.s3.existingSecret + media.s3.endpoint.
minio:
  enabled: false
  image: minio/minio:RELEASE.2024-01-16T16-07-38Z
  pullPolicy: IfNotPresent
  # Root creds boot the MinIO server and provision the bucket + app user.
  # omni-api does NOT use them — it consumes the scoped app creds below.
  # Ignored when media.s3.existingSecret is set.
  rootUser: omni
  rootPassword: ""       # REQUIRED when minio.enabled and no existingSecret
  # Scoped S3 app user minted for omni-api (builtin readwrite policy) —
  # distinct from root. Empty appPassword => auto-generate a stable random
  # preserved across upgrades (helm lookup; template-rendering GitOps must pin
  # it or use media.s3.existingSecret).
  appUser: omni-media
  appPassword: ""
  service:
    port: 9000           # S3 API
    consolePort: 9001    # web console
  persistence:
    storageClass: ""
    size: 10Gi
  # StatefulSet PVC retention. Empty {} => omit the field (k8s default
  # Retain/Retain). Self-host overlays may set {whenDeleted: Retain,
  # whenScaled: Retain} to make media data-safety explicit.
  persistentVolumeClaimRetentionPolicy: {}
  # mc (MinIO client) image for the bucket bootstrap Job + omni-api initContainer.
  mc:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    pullPolicy: IfNotPresent
  bootstrap:
    backoffLimit: 10
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
