# =============================================================================
# omni umbrella chart — default values
# =============================================================================
# Override with values-dev.yaml (OrbStack) or values-prod.yaml (registry+HPA).
# =============================================================================

nameOverride: ""
fullnameOverride: ""

# ---- omni-api image ---------------------------------------------------------
image:
  repository: omni-api
  tag: dev
  # OrbStack shares its image store with k8s, so a locally-built image needs
  # no registry. Use Never (dev) / IfNotPresent or Always (prod).
  pullPolicy: IfNotPresent
imagePullSecrets: []

# ---- replicas + scaling -----------------------------------------------------
# SINGLE replica by default: omni-api holds a live in-memory WhatsApp/Baileys
# socket (WhatsApp permits ONE active connection per credential). Baileys creds
# are DB-backed (DatabasePluginStorage), but the live socket is not shareable,
# so true horizontal scaling needs session/socket ownership moved off-node
# (follow-up). Keep replicaCount: 1 and HPA disabled until then.
replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ""

# RollingUpdate would briefly run 2 pods (2 WhatsApp sockets). Recreate keeps
# exactly one api pod live across rollouts.
strategy:
  type: Recreate

# ---- service ----------------------------------------------------------------
service:
  type: ClusterIP
  port: 8882
  # api listens on API_PORT (8882) — see containerPort below.

# ---- ingress ----------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: omni.local
  path: /
  pathType: Prefix
  tls: []

# ---- app config (non-secret → ConfigMap / plain env) ------------------------
config:
  API_HOST: "0.0.0.0"
  API_PORT: "8882"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  # HOME → PVC mount so any home-relative state (~/.omni, media cache) persists.
  HOME: "/data"

# Free-form extra non-secret env (key: value) merged into the ConfigMap.
extraConfig: {}

# ---- env wiring: DATABASE_URL + NATS_URL ------------------------------------
env:
  # NATS_URL — leave empty to derive from the bundled NATS Service (see nats.*),
  # or set explicitly (e.g. nats://my-nats:4222) to point at external NATS.
  natsUrl: ""

# ---- database (autopg) contract ---------------------------------------------
# The omni-api needs DATABASE_URL=postgresql://<role>:<pw>@<host>:5432/omni,
# where <role> OWNS the omni tables (migrations ALTER them on boot).
#
# INTEGRATION (lead): the autopg subchart provisions db `omni` + a scoped
# owner role and (ideally) publishes a Secret containing a ready DATABASE_URL.
# Point omni at it via database.existingSecret / database.urlKey. Otherwise the
# chart assembles DATABASE_URL from the fields below and stores it in the omni
# Secret.
database:
  # Option A (preferred at integration): consume a Secret that already holds a
  # full DATABASE_URL (e.g. the one autopg emits). When set, host/user/password
  # below are ignored.
  existingSecret: ""      # e.g. "<release>-autopg-app"
  urlKey: "DATABASE_URL"  # key within existingSecret holding the URL

  # Option B (chart-assembled URL, stored in the omni Secret):
  host: ""                # REQUIRED if existingSecret empty → autopg Service DNS
  port: 5432
  name: omni
  user: omni              # scoped role that OWNS the omni tables
  password: ""            # set via -f / --set-string, or use passwordSecret*
  # Or source the password from an existing secret (kept out of the URL string):
  passwordExistingSecret: ""
  passwordSecretKey: "password"
  sslmode: ""             # e.g. "disable" / "require"; empty → omit

# ---- secret (OMNI_API_KEY + assembled DATABASE_URL) -------------------------
secret:
  # Reuse an existing Secret instead of minting one. Must contain OMNI_API_KEY
  # (and DATABASE_URL if database.existingSecret is not used).
  existingSecret: ""
  apiKeyKey: "OMNI_API_KEY"
  # OMNI_API_KEY value — generate a strong key. Leave empty to let omni-api
  # auto-generate one at boot (printed masked in logs; not reproducible).
  omniApiKey: ""

# ---- Baileys / session PVC --------------------------------------------------
# HOME (/data) lives on this PVC so home-relative runtime state survives pod
# restarts. Required while replicaCount stays 1.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  mountPath: /data

# ---- probes -----------------------------------------------------------------
# GET /health → 200 {"status":"healthy",...} once DB + NATS are up.
probes:
  readiness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  liveness:
    path: /health
    initialDelaySeconds: 45
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  # Migrations + DB readiness can take 30s+; startupProbe guards slow boots.
  startup:
    path: /health
    periodSeconds: 5
    failureThreshold: 30

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
podSecurityContext:
  # oven/bun image runs as uid 1000 (bun). fsGroup makes the PVC group-writable.
  fsGroup: 1000
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []          # raw env entries (list of {name,value}/{name,valueFrom})
extraVolumes: []
extraVolumeMounts: []

# =============================================================================
# Subchart / bundled-dependency values
# =============================================================================

# ---- autopg (placeholder subchart; lead vendors the real chart) -------------
autopg:
  enabled: true
  # The lead's real autopg values go here. The placeholder chart at
  # charts/autopg/ only needs `enabled`. Document the Service name it exposes
  # and set `database.host` (above) to it, e.g. "<release>-autopg".

# ---- bundled NATS + JetStream ----------------------------------------------
nats:
  enabled: true
  image: nats:2.10-alpine
  port: 4222
  monitorPort: 8222
  externalHost: ""    # used only when nats.enabled=false
  jetstream:
    enabled: true
    memStore: 256Mi
    fileStore: 1Gi
  persistence:
    storageClass: ""
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
