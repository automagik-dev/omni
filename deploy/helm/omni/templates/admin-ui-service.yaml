{{- if .Values.adminUi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omni.adminUi.fullname" . }}
  labels:
    {{- include "omni.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-ui
spec:
  type: {{ .Values.adminUi.service.type }}
  selector:
    {{- include "omni.adminUiSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.adminUi.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
