{{- if .Values.adminUi.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omni.adminUi.fullname" . }}-config
  labels:
    {{- include "omni.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-ui
data:
  # The UI binds 0.0.0.0 in-cluster; PORT is driven by the Service port so the
  # container port, Service targetPort, and bind port stay in lockstep.
  HOST: {{ .Values.adminUi.config.HOST | default "0.0.0.0" | quote }}
  PORT: {{ .Values.adminUi.service.port | quote }}
  # The Omni the UI's plugins call from the server (defaults to the in-cluster
  # omni-api Service when adminUi.config.OMNI_BASE_URL is empty).
  OMNI_BASE_URL: {{ include "omni.adminUi.baseUrl" . | quote }}
  {{- with (include "omni.adminUi.publicUrl" .) }}
  # The URL people open: DSH advertises it in the launch URL and trusts its host.
  OMNI_UI_PUBLIC_URL: {{ . | quote }}
  {{- end }}
  {{- range $k, $v := .Values.adminUi.extraConfig }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
