apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omni.fullname" . }}-config
  labels:
    {{- include "omni.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- range $k, $v := .Values.extraConfig }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  NATS_URL: {{ include "omni.natsUrl" . | quote }}
  # ---- media backend (non-secret) — OMNI_MEDIA_* ----------------------------
  # Secret creds (OMNI_MEDIA_S3_ACCESS_KEY / _SECRET_KEY) are injected by
  # secretKeyRef in the Deployment, never rendered here.
  {{- if include "omni.media.remote" . }}
  OMNI_MEDIA_MODE: "remote"
  OMNI_MEDIA_S3_ENDPOINT: {{ include "omni.media.s3Endpoint" . | quote }}
  OMNI_MEDIA_S3_BUCKET: {{ .Values.media.s3.bucket | quote }}
  OMNI_MEDIA_S3_REGION: {{ .Values.media.s3.region | quote }}
  OMNI_MEDIA_S3_FORCE_PATH_STYLE: {{ .Values.media.s3.forcePathStyle | quote }}
  OMNI_MEDIA_S3_PRESIGN_TTL_SECONDS: {{ .Values.media.s3.presignTtlSeconds | quote }}
  {{- else }}
  OMNI_MEDIA_MODE: {{ default "local" .Values.media.mode | quote }}
  {{- end }}
