{{- if and .Values.adminUi.enabled (gt (len (default (dict) .Values.adminUi.secret.env)) 0) }}
{{- /*
Chart-minted Secret carrying the admin UI's OMNI_API_KEY (and any other inline
adminUi.secret.env entries). This is the local/dev path — supply the key at
deploy time with `--set adminUi.secret.env.OMNI_API_KEY=omni_sk_…` so it never
lands in git. In a realm with External Secrets, prefer
adminUi.secret.existingSecret pointing at the ESO-synced Secret instead and
leave adminUi.secret.env empty (this Secret then does not render).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omni.adminUi.secretName" . }}
  labels:
    {{- include "omni.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-ui
type: Opaque
stringData:
  {{- range $k, $v := .Values.adminUi.secret.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
