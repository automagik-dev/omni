{{- /*
The omni Secret holds:
  - OMNI_API_KEY   (unless secret.existingSecret, or omniApiKey empty → api
                    auto-generates one at boot)
  - DATABASE_URL   (assembled from database.* when database.existingSecret is
                    empty; requires an inline database.password)
Rendered only when there is at least one key to store.
*/ -}}
{{- $storeApiKey := and (not .Values.secret.existingSecret) .Values.secret.omniApiKey -}}
{{- $assembleDbUrl := and (not .Values.database.existingSecret) (not .Values.database.passwordExistingSecret) -}}
{{- if or $storeApiKey $assembleDbUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omni.secretName" . }}
  labels:
    {{- include "omni.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $storeApiKey }}
  {{ .Values.secret.apiKeyKey }}: {{ .Values.secret.omniApiKey | quote }}
  {{- end }}
  {{- if $assembleDbUrl }}
  {{- if not .Values.database.host }}
  {{- fail "database.host is required (set it to the autopg Service DNS) when database.existingSecret is not used" }}
  {{- end }}
  {{- $q := ternary (printf "?sslmode=%s" .Values.database.sslmode) "" (ne (default "" .Values.database.sslmode) "") }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s%s" .Values.database.user .Values.database.password .Values.database.host .Values.database.port .Values.database.name $q | quote }}
  {{- end }}
{{- end }}
