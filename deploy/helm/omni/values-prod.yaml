# =============================================================================
# Production overlay — registry image, HPA on, real ingress + TLS.
#   helm upgrade --install omni deploy/helm/omni -n omni \
#     -f deploy/helm/omni/values-prod.yaml
#   DB creds come from the autopg-published Secret (database.existingSecret).
# =============================================================================

image:
  repository: ghcr.io/automagik-dev/omni-api   # set to your registry/path
  # Pin a tag that EXISTS on GHCR. image-publish.yml pushes v<packages/cli
  # version> (plus :main, :main-<sha12>) on merges to main — v2.260704.4 is
  # the latest published release at pin time. Leave "" to track the chart's
  # appVersion (v<appVersion>).
  tag: "v2.260704.4"
  pullPolicy: IfNotPresent
imagePullSecrets: []

# ONE replica, HPA off (see values.yaml "replicas + scaling"): a single
# WhatsApp credential maps to one live Baileys socket, so concurrent replicas
# risk key-ratchet corruption / duplicate sends until single-socket ownership
# (leader election) exists. Scale out only for HTTP/API + non-WhatsApp
# traffic — the chart then auto-adds a PDB + pod anti-affinity, and
# migrate-on-boot serializes via a Postgres advisory lock.
replicaCount: 1
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

config:
  LOG_LEVEL: "info"
  NODE_ENV: "production"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: omni.example.com
  path: /
  pathType: Prefix
  tls:
    - secretName: omni-tls
      hosts:
        - omni.example.com

# DATABASE_URL comes from the Secret the autopg subchart publishes:
# `<release>-autopg-app`, key DATABASE_URL (password percent-encoded). With
# existingSecret/host left empty the chart auto-derives that name for ANY
# release name — set existingSecret only to point at your own Secret instead.
database:
  existingSecret: ""
  urlKey: "DATABASE_URL"

secret:
  # No OMNI_API_KEY — omni auth keys live in Postgres. Optionally supply
  # provider creds here (or reference an existing Secret via existingSecret):
  existingSecret: ""
  env: {}
    # OPENAI_API_KEY: ""
    # ANTHROPIC_API_KEY: ""
    # SENTRY_DSN: ""
    # OTEL_EXPORTER_OTLP_ENDPOINT: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

nats:
  enabled: true
  jetstream:
    enabled: true
    memStore: 512Mi
    fileStore: 4Gi
  persistence:
    size: 8Gi
    # storageClass: fast-ssd

# Prod media backend: an EXTERNAL managed S3 bucket. Creds come from an existing
# Secret (never plaintext in rendered output); the bucket is provisioned out of
# band. Set media.s3.endpoint to your provider's endpoint, or leave empty for
# real AWS S3 (SDK derives it from region; set forcePathStyle=false for AWS).
media:
  mode: remote
  s3:
    bucket: omni-media
    region: us-east-1
    forcePathStyle: false
    presignTtlSeconds: 3600
    endpoint: ""                         # empty → real AWS S3 from region
    # Presign GET URLs against a public endpoint instead of `endpoint` —
    # required when agents consuming presigned media URLs run OUTSIDE the
    # cluster and cannot reach the internal S3 endpoint. Uploads/reads are
    # unaffected. Leave unset when `endpoint` is already publicly reachable
    # (e.g. real AWS S3).
    # publicEndpoint: "https://media.example.com"
    existingSecret: "omni-media-s3"      # must hold the two keys below
    accessKeyKey: "OMNI_MEDIA_S3_ACCESS_KEY"
    secretKeyKey: "OMNI_MEDIA_S3_SECRET_KEY"

# Bundled MinIO is OFF in prod (external S3 is the story). Flip to true only if
# you want an in-cluster MinIO instead of a managed bucket.
minio:
  enabled: false

# Bundled autopg Postgres. SECURITY: assumes a single-tenant cluster + the
# chart's NetworkPolicy (networkPolicy.enabled, on by default) — the autopg
# superuser password is hardcoded and unrotatable, see values.yaml `autopg:`.
autopg:
  enabled: true
  image:
    # v<autopg release> — matches charts/autopg Chart.yaml appVersion (3.0.7).
    # Published by the omni image-publish workflow; NOTE: a prod deploy before
    # the first publish run to ghcr.io/automagik-dev/autopg will
    # ImagePullBackOff. Leave tag "" to track the subchart's appVersion.
    repository: ghcr.io/automagik-dev/autopg
    tag: "v3.0.7"
    pullPolicy: IfNotPresent
