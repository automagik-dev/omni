# =============================================================================
# OrbStack / local dev overlay
#   helm upgrade --install omni deploy/helm/omni -n omni --create-namespace \
#     -f deploy/helm/omni/values-dev.yaml
# =============================================================================

image:
  repository: omni-api
  tag: dev
  # Image is built locally into OrbStack's shared store — never pull.
  pullPolicy: Never

# Keep dev light: one replica, HPA off. omni-api is stateless either way.
replicaCount: 1
autoscaling:
  enabled: false

config:
  LOG_LEVEL: "debug"
  NODE_ENV: "development"
  # Every realm below terminates client TLS at a reverse proxy (nginx-ingress
  # here; the ALB delta layered after this file swaps the controller but keeps
  # the same shape), so the socket peer the API sees is the proxy, not the
  # caller. Without this the auth-exempt webhook ingress buckets every caller
  # under one shared key. resolveClientIp() reads the RIGHTMOST hop — the one
  # this realm's own proxy appends — so a client-forged prefix cannot pick its
  # own bucket. Set ONLY where a trusted proxy really fronts the pod: with the
  # pod directly reachable, the whole header is caller-controlled.
  TRUSTED_PROXY_HEADER: "X-Forwarded-For"

ingress:
  enabled: true
  className: "nginx"     # ingress-nginx is the cluster default IngressClass
  host: omni.felipe.namastex.io
  path: /
  pathType: Prefix
  # TLS rides ingress-nginx's default wildcard cert
  # (ingress-nginx/felipe-wildcard-tls, SANs *.felipe.namastex.io + apex) wired via
  # --default-ssl-certificate, so no per-Ingress secretName is needed. The tls block
  # only declares the host so nginx terminates HTTPS for it.
  tls:
    - hosts:
        - omni.felipe.namastex.io

# Dev DB wiring — the lead sets database.host to the autopg Service once the
# real subchart is vendored (e.g. "omni-autopg"). Password via --set-string or
# an existingSecret. Placeholder below keeps `helm template` honest.
database:
  host: omni-autopg      # autopg Service name (release "omni" + "-autopg")
  port: 5432
  name: omni
  user: omni
  password: "omni-dev-password"   # dev only — override in real use
  sslmode: disable

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: "1"
    # Bumped 768Mi -> 1536Mi: media processing (image decode + gemini calls)
    # spikes; a live baseline of ~467Mi was already 61% of the old limit.
    memory: 1536Mi

nats:
  enabled: true
  persistence:
    size: 512Mi
  # Keep the JetStream data PVC if the StatefulSet is deleted (self-host safety).
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  # Expose the client port (:4222) on an OrbStack LoadBalancer so a
  # `genie omni serve` bridge running on a sibling VM can subscribe to
  # omni.message.* and reply on omni.reply.*. Trusted host-net only.
  externalAccess: true

# Remote media backend backed by the bundled MinIO — a self-contained k8s dev
# object store. Path-style addressing (MinIO requires it); dev creds inline.
media:
  mode: remote
  s3:
    bucket: omni-media
    region: us-east-1
    forcePathStyle: true
    presignTtlSeconds: 3600
    endpoint: ""          # empty → derived from the bundled MinIO Service

minio:
  enabled: true
  # minio/minio + minio/mc are public images (unlike the locally-built omni-api),
  # so they pull normally — do NOT set pullPolicy: Never here.
  rootUser: omni
  rootPassword: "omni-dev-minio-password"   # dev only — override in real use
  persistence:
    # NOTE: local-path does not enforce quota; sized for the migrated WhatsApp
    # media corpus (~15Gi) + growth. Applies to fresh installs only
    # (volumeClaimTemplates are immutable on an existing StatefulSet).
    size: 30Gi
  # Keep the media PVC if the StatefulSet is deleted (self-host safety). Note the
  # local-path PV reclaimPolicy is still Delete — see deploy/backup/README.md.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  resources:
    requests:
      memory: 256Mi
    limits:
      # 512Mi OOM-killed MinIO (exit 137) under sustained ~10MiB/s media
      # ingest during the 15GiB migration — 2Gi rides it out comfortably.
      memory: 2Gi

autopg:
  enabled: true
  image:
    repository: autopg
    tag: dev
    pullPolicy: Never
  # Provision the omni DB + schema-owning role with the SAME password omni-api
  # uses in database.password above, so the assembled DATABASE_URL authenticates.
  provisionedApps:
    - db: omni
      role: omni
      password: "omni-dev-password"
  persistence:
    size: 2Gi
  # Keep the Postgres data PVC if the StatefulSet is deleted (self-host safety).
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

# Expose the api to the host (OrbStack assigns a LoadBalancer IP reachable
# from the Mac) — the omni CLI on the host points at this endpoint.
service:
  type: LoadBalancer
  port: 8882

# ---- Admin UI (khal-ui) — dogfood on the local dev cluster ------------------
# Single-container pod: the BFF serves the built SPA AND proxies /omni/* to the
# in-cluster omni-api Service (OMNI_BASE_URL defaults to http://omni:8882).
# Build the image locally with `make -C deploy build-ui` (omni-admin-ui:dev,
# pullPolicy Never — never pulled). Supply the real bearer key at deploy time:
#   make -C deploy deploy OMNI_API_KEY=omni_sk_…
# (threaded into --set adminUi.secret.env.OMNI_API_KEY). NEVER commit a key.
adminUi:
  enabled: true
  image:
    repository: omni-admin-ui
    tag: dev
    pullPolicy: Never
  ingress:
    enabled: true
    className: nginx       # ingress-nginx is the cluster default IngressClass
    host: admin.omni.felipe.namastex.io
    path: /
    pathType: Prefix
    # TLS rides ingress-nginx's default wildcard cert (*.felipe.namastex.io),
    # same as the api ingress above — the block only declares the host.
    tls:
      - hosts:
          - admin.omni.felipe.namastex.io
