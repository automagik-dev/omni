apiVersion: v2
name: omni
description: Omni — multi-channel messaging API (Bun/Hono) with Postgres (autopg) and NATS/JetStream
type: application
version: 0.1.0
# appVersion = the version this tree publishes when promoted. Every version
# bump (version.yml → scripts/sync-versions.ts) stamps this line in lockstep
# with every package.json, and image-publish.yml pushes
# ghcr.io/automagik-dev/omni-api:v<appVersion> when the tree lands on main or
# homolog. The chart's default image tag is v<appVersion>, so a promoted tree
# always references exactly the image its own promotion publishes. Do not edit
# by hand — scripts/verify-versions.ts fails CI on drift.
appVersion: "2.260713.4"
keywords:
  - omni
  - messaging
  - whatsapp
  - nats
  - postgres
sources:
  - https://github.com/automagik-dev/omni
maintainers:
  - name: automagik-dev
dependencies:
  # autopg — the REAL vendored PostgreSQL 18 chart (from automagik-dev/autopg),
  # not a placeholder: single-replica StatefulSet + scoped-role provisioning +
  # a published `<release>-autopg-app` DATABASE_URL Secret. Do not rip it out.
  # Its values live under the top-level `autopg:` key; toggle with
  # `autopg.enabled` to use an external Postgres instead.
  - name: autopg
    version: "0.1.0"
    repository: "file://./charts/autopg"
    condition: autopg.enabled
#
# NATS is BUNDLED as first-party templates (templates/nats-*.yaml) rather than
# pulled as a subchart: it keeps OrbStack verification fully offline (no
# `helm dep build` network round-trip) and pins a minimal JetStream+PVC config
# we control. See values.yaml `nats:` and DEVIATIONS in the PR description.
